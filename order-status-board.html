<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Order Status | Roll-In Shawarma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --panel:#121110;
    --white:#FFFCF3;
    --cream:#F3EAC9;
    --muted:rgba(243,234,201,0.62);
    --gold:#F7AD28;
    --red:#D8342E;
    --green:#0BAF4C;
    --purple:#9B6DFF;
    --line:rgba(243,234,201,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html, body{ overflow:hidden; height:100%; width:100%; overscroll-behavior:none; }
  body{
    background:var(--black); color:var(--cream); font-family:'Inter', -apple-system, sans-serif;
    line-height:1.4; user-select:none; display:flex; flex-direction:column;
  }

  header{
    display:flex; align-items:center; gap:16px; padding:20px 32px; border-bottom:1px solid var(--line); flex:none;
  }
  header img{ width:52px; height:52px; border-radius:50%; object-fit:cover; }
  header h1{ font-size:24px; font-weight:800; color:var(--white); }
  header .sub{ font-size:13px; color:var(--muted); margin-top:2px; }

  #errorBanner{
    display:none; background:rgba(216,52,46,0.16); color:var(--red); font-size:14px; font-weight:700;
    padding:10px 32px; border-bottom:1px solid var(--red); flex:none;
  }

  #main{ flex:1; min-height:0; display:flex; }

  #orderList{ flex:2; min-width:0; overflow-y:auto; padding:24px 32px; display:flex; flex-direction:column; gap:14px; }
  .order-row{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 28px;
  }
  .order-row.stage-preparing{ border-color:var(--gold); background:rgba(247,173,40,0.08); }
  .order-row.stage-ready{ border-color:var(--green); background:rgba(11,175,76,0.1); }
  .order-row.stage-picked_up{ border-color:var(--purple); background:rgba(155,109,255,0.1); opacity:0.7; }
  .order-row-left{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .order-row-name{ font-size:24px; font-weight:800; color:var(--white); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .order-row-ref{ font-size:14px; color:var(--muted); font-weight:600; }
  .status-badge{
    flex:none; font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
    padding:10px 20px; border-radius:100px;
  }
  .status-badge.placed{ background:rgba(243,234,201,0.1); color:var(--muted); border:1px solid var(--line); }
  .status-badge.preparing{ background:rgba(247,173,40,0.16); color:var(--gold); border:1px solid var(--gold); }
  .status-badge.ready{ background:var(--green); color:#04220F; }
  .status-badge.picked_up{ background:var(--purple); color:#1A0B33; }

  #emptyHint{ text-align:center; color:var(--muted); font-size:18px; padding:60px 20px; }

  #thanksCard{
    flex:1; max-width:340px; flex-shrink:0; border-left:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 28px; gap:18px;
  }
  #thanksCard .heart{ font-size:40px; }
  #thanksCard h2{ font-size:22px; font-weight:800; color:var(--white); line-height:1.3; }
  #thanksCard p{ font-size:15px; color:var(--muted); line-height:1.6; max-width:26ch; }
  #thanksCard .signoff{ font-size:14px; font-weight:700; color:var(--gold); margin-top:6px; }

  @media (max-width:820px){
    #main{ flex-direction:column; }
    #thanksCard{ max-width:none; border-left:none; border-top:1px solid var(--line); padding:24px; }
  }
</style>
</head>
<body>

<header>
  <img src="logo.jpg" alt="Roll-In Shawarma">
  <div>
    <h1>Order Status</h1>
    <div class="sub">First come, first served</div>
  </div>
</header>

<div id="errorBanner"></div>

<div id="main">
  <div id="orderList"></div>
  <div id="thanksCard">
    <div class="heart">&#10084;&#65039;</div>
    <h2>Thank you for<br>supporting local!</h2>
    <p>Every order helps keep a small, family-run food truck rolling. We're grateful you're here.</p>
    <div class="signoff">&mdash; The Roll-In Shawarma Family</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var sb = supabase.createClient(
    'https://njcmcaoyzujijiyfardx.supabase.co',
    'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_'
  );

  function escHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fetchAndRender(){
    sb.rpc('get_public_order_status_board').then(function(res){
      if (res.error || !res.data) {
        var detail = res.error ? (res.error.message || res.error.code || JSON.stringify(res.error)) : 'no data returned';
        console.error('get_public_order_status_board failed:', detail, res.error);
        showError('Could not load orders \u2014 ' + detail);
        return;
      }
      clearError();
      var listEl = document.getElementById('orderList');
      if (!res.data.length) {
        listEl.innerHTML = '<div id="emptyHint">No orders right now &mdash; come say hi!</div>';
        return;
      }
      var STAGE_LABELS = { placed: 'Order Placed', preparing: 'Preparing', ready: 'Ready', picked_up: 'Picked Up' };
      listEl.innerHTML = res.data.map(function(o){
        var stage = o.display_stage || 'placed';
        var label = STAGE_LABELS[stage] || 'Order Placed';
        return '<div class="order-row stage-' + stage + '">' +
          '<div class="order-row-left">' +
            '<div class="order-row-name">' + escHtml(o.first_name) + '</div>' +
            '<div class="order-row-ref">' + escHtml(o.reference_code) + '</div>' +
          '</div>' +
          '<div class="status-badge ' + stage + '">' + label + '</div>' +
        '</div>';
      }).join('');
    }).catch(function(err){
      console.error('get_public_order_status_board threw:', err);
      showError("Couldn't reach the server \u2014 check the connection.");
    });
  }

  function showError(msg){
    var el = document.getElementById('errorBanner');
    if (!el) return;
    el.textContent = msg;
    el.style.display = 'block';
  }
  function clearError(){
    var el = document.getElementById('errorBanner');
    if (el) el.style.display = 'none';
  }

  fetchAndRender();
  // Realtime keeps this feeling instant; the 20s poll is a safety
  // net in case a realtime event is ever missed, matching the same
  // pattern as the kitchen board -- this screen should never require
  // a manual refresh either.
  sb.channel('public-order-board')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, fetchAndRender)
    .subscribe();
  setInterval(fetchAndRender, 20000);
</script>
</body>
</html>
