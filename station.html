<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kitchen Board | Roll-In Shawarma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --panel:#121110;
    --white:#FFFCF3;
    --cream:#F3EAC9;
    --muted:rgba(243,234,201,0.62);
    --gold:#F7AD28;
    --red:#D8342E;
    --green:#0BAF4C;
    --blue:#3B9DFF;
    --line:rgba(243,234,201,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html, body{ overflow:hidden; height:100%; width:100%; overscroll-behavior:none; }
  body{
    background:var(--black); color:var(--cream); font-family:'Inter', -apple-system, sans-serif;
    line-height:1.4; user-select:none;
  }
  .hidden{ display:none !important; }
  button{ font-family:inherit; border:none; cursor:pointer; background:none; color:inherit; }

  /* ---------- PIN SCREEN ---------- */
  #pinScreen{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
  }
  #pinScreen h1{ font-size:24px; font-weight:800; color:var(--white); }
  #pinDots{ display:flex; gap:16px; }
  #empPinDots{ display:flex; gap:16px; }
  .pin-dot{ width:18px; height:18px; border-radius:50%; border:2px solid var(--line); }
  .pin-dot.filled{ background:var(--gold); border-color:var(--gold); }
  #pinError{ font-size:15px; color:var(--red); font-weight:700; min-height:20px; }
  .pin-pad{ display:grid; grid-template-columns:repeat(3, 84px); gap:16px; }
  .pin-key{
    width:84px; height:84px; border-radius:50%; background:var(--panel); border:1px solid var(--line);
    color:var(--white); font-size:30px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .pin-key:active{ background:var(--gold); color:#241902; }
  .pin-key.wide{ background:none; border:none; color:var(--muted); font-size:16px; font-weight:700; }

  /* ---------- BOARD LAYOUT ---------- */
  #board{ height:100%; display:flex; flex-direction:column; }
  #boardHeader{
    display:flex; align-items:center; justify-content:space-between; padding:16px 24px;
    border-bottom:1px solid var(--line); flex:none;
  }
  #boardHeader h1{ font-size:19px; font-weight:800; color:var(--white); }
  #boardClock{ font-size:15px; color:var(--muted); font-weight:600; }
  .board-last-updated{ font-size:12px; color:var(--muted); opacity:0.7; margin-right:14px; }
  .board-last-updated.stale{ color:var(--red); opacity:1; font-weight:700; }
  #lockBtn{ font-size:14px; color:var(--muted); font-weight:700; padding:8px 14px; border:1px solid var(--line); border-radius:100px; }
  #boardErrorBanner{ background:rgba(216,52,46,0.16); color:var(--red); font-size:14.5px; font-weight:700; padding:10px 24px; border-bottom:1px solid var(--red); flex:none; }

  #panels{ flex:1; min-height:0; display:flex; }
  #itemPanel{ flex:1.3; min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  #queuePanel{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .panel-head{
    padding:14px 20px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); border-bottom:1px solid var(--line); flex:none;
  }

  /* ---------- ITEM PANEL: 3 columns ---------- */
  #itemColumns{ flex:1; min-height:0; display:flex; }
  .item-col{ flex:1; min-width:0; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .item-col-label{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; text-align:center;
    padding-bottom:8px; flex:none;
  }
  #colQueued .item-col-label{ color:var(--muted); }
  #colPrepping .item-col-label{ color:var(--gold); }
  #colReady .item-col-label{ color:var(--green); }

  .item-box{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-radius:14px; flex:none;
  }
  .item-box .nm{ font-size:16.5px; font-weight:700; }
  .item-box .cnt{ font-size:19px; font-weight:800; }

  /* Gray and orange get a bigger tap target since they're the ones
     actually tapped repeatedly during a rush -- green is display-only
     and stays more compact. */
  .box-gray, .box-orange{ padding:18px 18px; min-height:34px; }
  .box-green{ padding:14px 16px; }

  .box-gray{ background:var(--panel); border:1px solid var(--line); }
  .box-gray .nm, .box-gray .cnt{ color:var(--white); }
  .box-gray:active{ background:#1c1a18; }

  .box-orange{ background:rgba(247,173,40,0.14); border:1px solid var(--gold); }
  .box-orange .nm, .box-orange .cnt{ color:var(--gold); }
  .box-orange:active{ background:rgba(247,173,40,0.24); }

  .box-green{ background:rgba(11,175,76,0.14); border:1px solid var(--green); }
  .box-green .nm, .box-green .cnt{ color:var(--green); }

  @keyframes kdsFlash{
    0%{ box-shadow:0 0 0 0 rgba(247,173,40,0); transform:scale(1); }
    30%{ box-shadow:0 0 0 6px rgba(247,173,40,0.35); transform:scale(1.035); }
    100%{ box-shadow:0 0 0 0 rgba(247,173,40,0); transform:scale(1); }
  }
  .item-box.flash{ animation:kdsFlash 0.7s ease-out; }

  .col-empty-hint{ text-align:center; color:var(--muted); font-size:13.5px; padding:20px 8px; }

  /* ---------- QUEUE PANEL ---------- */
  #queueList{ flex:1; min-height:0; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .order-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .order-card.order-complete{ border-color:var(--green); background:rgba(11,175,76,0.1); }
  .order-card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .order-ref{ font-size:17px; font-weight:800; color:var(--white); }
  .order-name{ font-size:13.5px; color:var(--muted); font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wait-time{ font-size:13.5px; font-weight:800; color:var(--muted); flex:none; white-space:nowrap; }
  @keyframes waitTimeBlink{
    0%, 49%{ opacity:1; }
    50%, 100%{ opacity:0.25; }
  }
  .wait-time.caution{ color:var(--gold); animation:waitTimeBlink 1s step-start infinite; }
  .wait-time.warn{ color:var(--red); animation:waitTimeBlink 1s step-start infinite; }
  .order-pills{ display:flex; flex-wrap:wrap; gap:6px; }
  .item-pill{
    font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:100px;
    background:rgba(216,52,46,0.16); color:var(--red); border:1px solid rgba(216,52,46,0.4);
  }
  .item-pill.pill-ready{ background:rgba(11,175,76,0.16); color:var(--green); border-color:rgba(11,175,76,0.4); }
  .item-pill.pill-prepping{ background:rgba(247,173,40,0.16); color:var(--gold); border-color:rgba(247,173,40,0.4); }
  .order-card.order-cash{ border-color:var(--red); }
  .order-card.order-curbside{ border-color:var(--blue); }
  .cash-warning{
    background:rgba(216,52,46,0.18); color:var(--red); border:1px solid var(--red); border-radius:8px;
    padding:8px 12px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.03em;
    text-align:center; margin-bottom:10px;
  }
  .curbside-badge{
    background:rgba(59,157,255,0.16); color:var(--blue); border:1px solid var(--blue); border-radius:8px;
    padding:8px 12px; font-size:14px; font-weight:800; text-align:center; margin-bottom:10px;
  }
  .complete-btn{
    margin-top:12px; width:100%; background:var(--green); color:#04220F; font-weight:800;
    font-size:14.5px; padding:12px; border-radius:10px;
  }
  /* ---------- IDLE / MAIN MENU / EMPLOYEE CLOCK-IN ---------- */
  #idleScreen{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px; background:radial-gradient(circle at 50% 30%, rgba(247,173,40,0.14), var(--black) 65%);
  }
  #idleScreen img.logo{ width:180px; height:180px; border-radius:50%; object-fit:cover; margin-bottom:36px; box-shadow:0 0 90px rgba(247,173,40,0.3); }
  #idleScreen h1{ font-size:56px; font-weight:800; color:var(--white); margin-bottom:16px; }
  #idleScreen p{ font-size:22px; color:var(--muted); margin-bottom:48px; }
  #startStationBtn{
    background:var(--gold); color:#241902; font-size:28px; font-weight:800;
    padding:28px 64px; border-radius:100px; box-shadow:0 20px 50px rgba(247,173,40,0.35);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }
  #mainMenuScreen{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  }
  #mainMenuScreen img.logo-small{ width:120px; height:120px; border-radius:50%; object-fit:cover; margin-bottom:10px; box-shadow:0 0 60px rgba(247,173,40,0.25); }
  .menu-choice-btn{
    width:320px; padding:28px; border-radius:100px; background:var(--gold); color:#241902;
    font-size:28px; font-weight:800; text-align:center;
  }
  .menu-choice-btn:active{ background:var(--white); }
  #mainMenuBackBtn{ font-size:14px; color:var(--muted); font-weight:700; padding:8px 14px; margin-top:10px; }

  #employeePinScreen{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
  }
  #employeePinScreen h1{ font-size:24px; font-weight:800; color:var(--white); }
  #employeeClockScreen{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:0 30px;
  }
  #employeeClockScreen h1{ font-size:26px; font-weight:800; color:var(--white); }
  #employeeClockStatus{ font-size:17px; color:var(--muted); }
  #employeeClockMsg{ min-height:20px; font-size:14px; font-weight:700; color:var(--red); }
  .station-clock-btn{
    width:220px; padding:20px; border-radius:100px; font-size:18px; font-weight:800; margin-top:8px;
  }
  #stationClockInBtn{ background:var(--green); color:#04210f; }
  #stationClockOutBtn{ background:var(--red); color:#2a0c0a; }
  #employeeExitBtn{ font-size:14px; color:var(--muted); font-weight:700; padding:8px 14px; margin-top:16px; }
  #kdsBackToMenuBtn{ font-size:13px; color:var(--muted); font-weight:600; margin-top:14px; }
</style>
</head>
<body>

<div id="idleScreen">
  <img class="logo" src="logo.jpg" alt="Roll-In Shawarma">
  <h1>Roll-In Shawarma</h1>
  <p>Staff Station</p>
  <button type="button" id="startStationBtn">Tap to continue</button>
</div>

<div id="mainMenuScreen" class="hidden">
  <img class="logo-small" src="logo.jpg" alt="Roll-In Shawarma">
  <button type="button" class="menu-choice-btn" id="menuClockInBtn">Clock In</button>
  <button type="button" class="menu-choice-btn" id="menuKitchenBtn">Kitchen Mode</button>
  <button type="button" id="mainMenuBackBtn">&larr; Back</button>
</div>
</div>

<div id="employeePinScreen" class="hidden">
  <h1>Enter Your PIN</h1>
  <div id="empPinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div id="empPinError"></div>
  <div class="pin-pad">
    <button type="button" class="pin-key" data-empdigit="1">1</button>
    <button type="button" class="pin-key" data-empdigit="2">2</button>
    <button type="button" class="pin-key" data-empdigit="3">3</button>
    <button type="button" class="pin-key" data-empdigit="4">4</button>
    <button type="button" class="pin-key" data-empdigit="5">5</button>
    <button type="button" class="pin-key" data-empdigit="6">6</button>
    <button type="button" class="pin-key" data-empdigit="7">7</button>
    <button type="button" class="pin-key" data-empdigit="8">8</button>
    <button type="button" class="pin-key" data-empdigit="9">9</button>
    <div></div>
    <button type="button" class="pin-key" data-empdigit="0">0</button>
    <button type="button" class="pin-key wide" id="empPinBackspace">&larr;</button>
  </div>
  <button type="button" id="employeePinCancelBtn">&larr; Back</button>
</div>

<div id="employeeClockScreen" class="hidden">
  <h1 id="employeeClockGreeting">&mdash;</h1>
  <div id="employeeClockStatus">&mdash;</div>
  <div id="employeeClockMsg"></div>
  <button type="button" class="station-clock-btn" id="stationClockInBtn">Clock In</button>
  <button type="button" class="station-clock-btn hidden" id="stationClockOutBtn">Clock Out</button>
  <button type="button" id="employeeExitBtn">Exit</button>
</div>

<div id="pinScreen" class="hidden">
  <h1>Enter Kitchen PIN</h1>
  <div id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div id="pinError"></div>
  <div class="pin-pad">
    <button type="button" class="pin-key" data-digit="1">1</button>
    <button type="button" class="pin-key" data-digit="2">2</button>
    <button type="button" class="pin-key" data-digit="3">3</button>
    <button type="button" class="pin-key" data-digit="4">4</button>
    <button type="button" class="pin-key" data-digit="5">5</button>
    <button type="button" class="pin-key" data-digit="6">6</button>
    <button type="button" class="pin-key" data-digit="7">7</button>
    <button type="button" class="pin-key" data-digit="8">8</button>
    <button type="button" class="pin-key" data-digit="9">9</button>
    <div></div>
    <button type="button" class="pin-key" data-digit="0">0</button>
    <button type="button" class="pin-key wide" id="pinBackspace">&larr;</button>
  </div>
  <button type="button" id="kdsBackToMenuBtn">&larr; Back to menu</button>
</div>

<div id="stationChoiceScreen" class="hidden">
  <button type="button" class="menu-choice-btn" id="chooseMainStationBtn">Main Station</button>
  <button type="button" class="menu-choice-btn" id="chooseSubStationBtn">Sub Station</button>
  <button type="button" id="stationChoiceBackBtn">&larr; Back to menu</button>
</div>

<div id="board" class="hidden">
  <div id="boardHeader">
    <h1>Kitchen Board</h1>
    <div id="boardLastUpdated" class="board-last-updated">&mdash;</div>
    <div id="boardClock">&mdash;</div>
    <button type="button" id="lockBtn">Lock Screen</button>
  </div>
  <div id="boardErrorBanner" class="hidden"></div>
  <div id="panels">
    <div id="itemPanel">
      <div class="panel-head">Item Prep</div>
      <div id="itemColumns">
        <div id="colQueued" class="item-col"><div class="item-col-label">To Prep</div></div>
        <div id="colPrepping" class="item-col"><div class="item-col-label">Prepping</div></div>
        <div id="colReady" class="item-col"><div class="item-col-label">Ready</div></div>
      </div>
    </div>
    <div id="queuePanel">
      <div class="panel-head">Order Queue &mdash; First In, First Out</div>
      <div id="queueList"></div>
    </div>
  </div>
</div>

<div id="fryerBoard" class="hidden">
  <div id="fryerBoardHeader">
    <h1>Fryer Station</h1>
    <div id="fryerBoardLastUpdated" class="board-last-updated">&mdash;</div>
    <div id="fryerBoardClock">&mdash;</div>
    <button type="button" id="fryerLockBtn">Lock Screen</button>
  </div>
  <div id="fryerBoardErrorBanner" class="hidden"></div>
  <div id="fryerPanels">
    <div id="fryerItemPanel">
      <div class="panel-head">Fryer Items</div>
      <div id="fryerItemColumns">
        <div id="fryerColQueued" class="item-col"><div class="item-col-label">To Prep</div></div>
        <div id="fryerColPrepping" class="item-col"><div class="item-col-label">Prepping</div></div>
        <div id="fryerColReady" class="item-col"><div class="item-col-label">Ready</div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var sb = supabase.createClient(
    'https://njcmcaoyzujijiyfardx.supabase.co',
    'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_'
  );

  function escHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------------- Sound system ----------------
  // Distinct per-source tones so staff can tell where a new order
  // came from without looking up. Generated with the Web Audio API
  // rather than linked audio files, keeping this one self-contained
  // HTML file with nothing extra to host or upload.
  (function(){
    var audioCtx = null;

    window.initKdsAudio = function(){
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) { /* Web Audio unsupported -- sounds just won't play, nothing else depends on this */ }
    };

    function beep(freq, startTime, duration, type){
      if (!audioCtx) return;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.28, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }

    var SOUNDS = {
      // Kiosk: a single, clear beep -- the most common source, kept simple.
      kiosk: function(){
        var t = audioCtx.currentTime;
        beep(660, t, 0.16, 'sine');
      },
      // QR: two quick beeps at a higher pitch.
      qr: function(){
        var t = audioCtx.currentTime;
        beep(784, t, 0.1, 'sine');
        beep(784, t + 0.14, 0.1, 'sine');
      },
      // Website/online: a rising two-tone chime.
      website: function(){
        var t = audioCtx.currentTime;
        beep(523, t, 0.13, 'sine');
        beep(659, t + 0.13, 0.16, 'sine');
      },
      // DoorDash: deliberately different timbre (square wave) and a
      // 3-tone pattern, since it's external and worth extra attention.
      doordash: function(){
        var t = audioCtx.currentTime;
        beep(440, t, 0.1, 'square');
        beep(440, t + 0.13, 0.1, 'square');
        beep(349, t + 0.26, 0.16, 'square');
      },
      // Walk-up POS orders: a low, single tone -- distinct from kiosk
      // but doesn't need the urgency of the external-order pattern.
      pos: function(){
        var t = audioCtx.currentTime;
        beep(330, t, 0.18, 'triangle');
      }
    };
    SOUNDS.qr_scan = SOUNDS.qr; // in case order_source is ever stored with an underscore variant

    window.playOrderSound = function(source){
      if (!audioCtx) return;
      var fn = SOUNDS[source] || SOUNDS.website;
      try { fn(); } catch(e) { console.error('playOrderSound failed:', e); }
    };
  })();

  // ---------------- Outer flow: idle -> menu -> clock-in / kitchen ----------------
  (function(){
    var idleScreen = document.getElementById('idleScreen');
    var mainMenuScreen = document.getElementById('mainMenuScreen');
    var employeePinScreen = document.getElementById('employeePinScreen');
    var employeeClockScreen = document.getElementById('employeeClockScreen');
    var pinScreen = document.getElementById('pinScreen');

    function showOnly(screen){
      [idleScreen, mainMenuScreen, employeePinScreen, employeeClockScreen, pinScreen].forEach(function(s){
        s.classList.toggle('hidden', s !== screen);
      });
    }

    document.getElementById('startStationBtn').addEventListener('click', function(){
      showOnly(mainMenuScreen);
    });

    document.getElementById('mainMenuBackBtn').addEventListener('click', function(){
      showOnly(idleScreen);
    });

    document.getElementById('kdsBackToMenuBtn').addEventListener('click', function(){
      // Deliberately does NOT touch sessionStorage's kdsUnlocked flag --
      // stepping back to the outer menu isn't the same as locking the
      // board, so a return trip to Kitchen Mode should still skip the
      // PIN if it was already entered this session.
      showOnly(mainMenuScreen);
    });

    document.getElementById('menuKitchenBtn').addEventListener('click', function(){
      var alreadyUnlocked = false;
      try { alreadyUnlocked = sessionStorage.getItem('kdsUnlocked') === '1'; } catch(e){}
      idleScreen.classList.add('hidden');
      mainMenuScreen.classList.add('hidden');
      employeePinScreen.classList.add('hidden');
      employeeClockScreen.classList.add('hidden');
      if (alreadyUnlocked) {
        pinScreen.classList.add('hidden');
        document.getElementById('stationChoiceScreen').classList.remove('hidden');
      } else {
        showOnly(pinScreen);
      }
    });

    // ---- Employee clock-in PIN entry ----
    var empEntered = '';
    var empPinDots = document.querySelectorAll('#empPinDots .pin-dot');
    var empErrorEl = document.getElementById('empPinError');
    var currentStationEmployee = null; // { employee_id, name, currently_clocked_in }

    function renderEmpDots(){
      empPinDots.forEach(function(d, i){ d.classList.toggle('filled', i < empEntered.length); });
    }

    function clearEmpDots(){
      empEntered = '';
      renderEmpDots();
    }

    function resetEmpPinEntry(){
      clearEmpDots();
      empErrorEl.textContent = '';
    }

    document.getElementById('menuClockInBtn').addEventListener('click', function(){
      resetEmpPinEntry();
      showOnly(employeePinScreen);
    });
    document.getElementById('employeePinCancelBtn').addEventListener('click', function(){
      showOnly(mainMenuScreen);
    });

    function tryEmpPinLookup(){
      sb.rpc('station_lookup_by_pin', { p_pin: empEntered }).then(function(res){
        if (res.error || !res.data || !res.data.length) {
          empErrorEl.textContent = 'Incorrect PIN';
          clearEmpDots();
          setTimeout(function(){ empErrorEl.textContent = ''; }, 1500);
          return;
        }
        currentStationEmployee = res.data[0];
        showEmployeeClockScreen();
      });
    }

    document.querySelectorAll('.pin-key[data-empdigit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (empEntered.length >= 4) return;
        empEntered += btn.getAttribute('data-empdigit');
        renderEmpDots();
        if (empEntered.length === 4) tryEmpPinLookup();
      });
    });
    document.getElementById('empPinBackspace').addEventListener('click', function(){
      empEntered = empEntered.slice(0, -1);
      renderEmpDots();
    });

    // ---- Employee clock in/out screen ----
    function showEmployeeClockScreen(){
      document.getElementById('employeeClockGreeting').textContent = 'Hi, ' + currentStationEmployee.name;
      document.getElementById('employeeClockMsg').textContent = '';
      refreshEmployeeClockUI();
      showOnly(employeeClockScreen);
    }

    function refreshEmployeeClockUI(){
      var inBtn = document.getElementById('stationClockInBtn');
      var outBtn = document.getElementById('stationClockOutBtn');
      var statusEl = document.getElementById('employeeClockStatus');
      if (currentStationEmployee.currently_clocked_in) {
        inBtn.classList.add('hidden');
        outBtn.classList.remove('hidden');
        statusEl.textContent = "You're clocked in";
      } else {
        inBtn.classList.remove('hidden');
        outBtn.classList.add('hidden');
        statusEl.textContent = "You're not clocked in";
      }
    }

    document.getElementById('stationClockInBtn').addEventListener('click', function(){
      var btn = this; btn.disabled = true;
      sb.rpc('station_clock_in', { p_pin: empEntered }).then(function(res){
        btn.disabled = false;
        var msgEl = document.getElementById('employeeClockMsg');
        if (res.error) { msgEl.textContent = res.error.message; return; }
        msgEl.textContent = '';
        currentStationEmployee.currently_clocked_in = true;
        refreshEmployeeClockUI();
      });
    });
    document.getElementById('stationClockOutBtn').addEventListener('click', function(){
      var btn = this; btn.disabled = true;
      sb.rpc('station_clock_out', { p_pin: empEntered }).then(function(res){
        btn.disabled = false;
        var msgEl = document.getElementById('employeeClockMsg');
        if (res.error) { msgEl.textContent = res.error.message; return; }
        msgEl.textContent = '';
        currentStationEmployee.currently_clocked_in = false;
        refreshEmployeeClockUI();
      });
    });

    document.getElementById('employeeExitBtn').addEventListener('click', function(){
      empEntered = '';
      currentStationEmployee = null;
      showOnly(idleScreen);
    });
  })();

  // ---------------- PIN gate ----------------
  (function(){
    var pinScreen = document.getElementById('pinScreen');
    var board = document.getElementById('board');
    var dots = document.querySelectorAll('.pin-dot');
    var errorEl = document.getElementById('pinError');
    var entered = '';

    function renderDots(){
      dots.forEach(function(d, i){ d.classList.toggle('filled', i < entered.length); });
    }

    function tryUnlock(){
      sb.rpc('verify_kds_pin', { p_pin: entered }).then(function(res){
        if (res.data === true) {
          try { sessionStorage.setItem('kdsUnlocked', '1'); } catch(e){}
          unlockBoard();
        } else {
          errorEl.textContent = 'Incorrect PIN';
          entered = '';
          renderDots();
          setTimeout(function(){ errorEl.textContent = ''; }, 1500);
        }
      });
    }

    document.querySelectorAll('.pin-key[data-digit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        window.initKdsAudio();
        if (entered.length >= 4) return;
        entered += btn.getAttribute('data-digit');
        renderDots();
        if (entered.length === 4) tryUnlock();
      });
    });
    document.getElementById('pinBackspace').addEventListener('click', function(){
      entered = entered.slice(0, -1);
      renderDots();
    });

    function unlockBoard(){
      pinScreen.classList.add('hidden');
      document.getElementById('stationChoiceScreen').classList.remove('hidden');
    }

    document.getElementById('chooseMainStationBtn').addEventListener('click', function(){
      document.getElementById('stationChoiceScreen').classList.add('hidden');
      board.classList.remove('hidden');
      window.startKdsBoard();
    });
    document.getElementById('chooseSubStationBtn').addEventListener('click', function(){
      document.getElementById('stationChoiceScreen').classList.add('hidden');
      document.getElementById('fryerBoard').classList.remove('hidden');
      window.startFryerBoard();
    });
    document.getElementById('stationChoiceBackBtn').addEventListener('click', function(){
      // Deliberately does NOT clear kdsUnlocked -- backing out to the
      // outer menu from here is a navigation step, not a security
      // lock, so the PIN shouldn't need re-entering to come back.
      document.getElementById('stationChoiceScreen').classList.add('hidden');
      document.getElementById('idleScreen').classList.remove('hidden');
      document.getElementById('mainMenuScreen').classList.add('hidden');
      document.getElementById('employeePinScreen').classList.add('hidden');
      document.getElementById('employeeClockScreen').classList.add('hidden');
    });

    document.getElementById('lockBtn').addEventListener('click', function(){
      try { sessionStorage.removeItem('kdsUnlocked'); } catch(e){}
      board.classList.add('hidden');
      pinScreen.classList.remove('hidden');
      entered = '';
      renderDots();
      if (window.stopKdsBoard) window.stopKdsBoard();
    });

    document.getElementById('fryerLockBtn').addEventListener('click', function(){
      try { sessionStorage.removeItem('kdsUnlocked'); } catch(e){}
      document.getElementById('fryerBoard').classList.add('hidden');
      pinScreen.classList.remove('hidden');
      entered = '';
      renderDots();
      if (window.stopFryerBoard) window.stopFryerBoard();
    });

  })();

  // ---------------- Clock ----------------
  (function(){
    var el = document.getElementById('boardClock');
    function tick(){
      var now = new Date();
      el.textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }
    tick();
    setInterval(tick, 15000);
  })();

  // ---------------- Board data + rendering ----------------
  (function(){
    var realtimeChannel = null;
    var pollTimer = null;
    var previousCounts = {};       // item_name -> {queued, prepping, ready}, for flash detection
    var isFirstItemRender = true;  // suppresses flashing everything on initial load, nothing actually "changed"
    var knownOrderIds = null;      // null until the first fetch establishes a baseline
    var lastFetchAt = null;
    var staleCheckTimer = null;
    var waitTimeTimer = null;

    window.startKdsBoard = function(){
      fetchAndRender();
      realtimeChannel = sb.channel('kds-board')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'prep_units' }, fetchAndRender)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, fetchAndRender)
        .subscribe();
      // Realtime is the primary path, but a 20s poll runs alongside
      // it as a safety net -- realtime subscriptions can occasionally
      // drop or miss an event silently, and this board should never
      // depend on someone noticing that and manually refreshing.
      pollTimer = setInterval(fetchAndRender, 20000);
      staleCheckTimer = setInterval(updateLastUpdatedDisplay, 5000);
      waitTimeTimer = setInterval(updateWaitTimes, 1000);
    };

    window.stopKdsBoard = function(){
      if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (staleCheckTimer) { clearInterval(staleCheckTimer); staleCheckTimer = null; }
      if (waitTimeTimer) { clearInterval(waitTimeTimer); waitTimeTimer = null; }
      previousCounts = {};
      isFirstItemRender = true;
      knownOrderIds = null;
      lastFetchAt = null;
    };

    // Ticks every second independent of the 20s data poll, so the
    // number moves smoothly rather than jumping. Only touches text
    // content on existing elements -- never re-renders the board, so
    // it can't interrupt someone mid-tap.
    function updateWaitTimes(){
      document.querySelectorAll('.wait-time').forEach(function(el){
        var createdAt = el.getAttribute('data-created-at');
        if (!createdAt) return;
        var elapsedSeconds = Math.max(0, Math.round((Date.now() - new Date(createdAt).getTime()) / 1000));
        var m = Math.floor(elapsedSeconds / 60);
        var s = elapsedSeconds % 60;
        el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
        // 3+ minutes is a caution, 5+ is a real warning -- both now
        // blink via CSS animation (see .wait-time.caution/.warn).
        el.classList.toggle('caution', elapsedSeconds >= 180 && elapsedSeconds < 300);
        el.classList.toggle('warn', elapsedSeconds >= 300);
      });
    }

    function fetchAndRender(){
      sb.rpc('get_kds_board_state').then(function(res){
        if (res.error) {
          console.error('get_kds_board_state failed:', res.error);
          showBoardError('Could not load the board \u2014 ' + (res.error.message || 'unknown error'));
          return;
        }
        if (!res.data) {
          console.error('get_kds_board_state returned no data');
          showBoardError('Board data came back empty \u2014 check the console.');
          return;
        }
        clearBoardError();
        detectNewOrdersAndPlaySounds(res.data);
        renderItemPanel(res.data);
        renderQueuePanel(res.data);
        lastFetchAt = Date.now();
        updateLastUpdatedDisplay();
      }).catch(function(err){
        console.error('get_kds_board_state threw:', err);
        showBoardError("Couldn't reach the server \u2014 check your connection.");
      });
    }

    function updateLastUpdatedDisplay(){
      var el = document.getElementById('boardLastUpdated');
      if (!el || !lastFetchAt) return;
      var secondsAgo = Math.round((Date.now() - lastFetchAt) / 1000);
      var label = secondsAgo < 5 ? 'Updated just now' : 'Updated ' + secondsAgo + 's ago';
      el.textContent = label;
      // 45s comfortably exceeds the 20s poll interval, so this only
      // ever fires if something's actually gone wrong, not from
      // ordinary timing jitter between updates.
      el.classList.toggle('stale', secondsAgo > 45);
    }

    // Compares this fetch's order_ids against what we already knew
    // about, and plays a source-specific sound for anything genuinely
    // new. The very first fetch after unlocking just establishes the
    // baseline silently -- every order that already existed when the
    // screen opened shouldn't trigger a sound.
    function detectNewOrdersAndPlaySounds(rows){
      var currentOrders = {}; // order_id -> order_source
      rows.forEach(function(r){ currentOrders[r.order_id] = r.order_source; });

      if (knownOrderIds === null) {
        knownOrderIds = currentOrders;
        return;
      }

      for (var orderId in currentOrders) {
        if (!(orderId in knownOrderIds)) {
          window.playOrderSound(currentOrders[orderId]);
        }
      }
      knownOrderIds = currentOrders;
    }

    function showBoardError(msg){
      var el = document.getElementById('boardErrorBanner');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function clearBoardError(){
      var el = document.getElementById('boardErrorBanner');
      if (el) el.classList.add('hidden');
    }

    // ---- Left panel: one dedicated row per item, all three stages
    // shown together so a row's position never changes as its item
    // moves through gray -> orange -> green.
    function renderItemPanel(rows){
      var byItem = {};
      rows.forEach(function(r){
        if (r.is_drink) return; // drinks are order-panel-only -- see renderQueuePanel
        if (!byItem[r.item_name]) byItem[r.item_name] = { queued: 0, prepping: 0, ready: 0 };
        byItem[r.item_name][r.status] += 1;
      });

      var itemNames = Object.keys(byItem).sort();

      renderColumn('colQueued', itemNames, byItem, 'queued', 'box-gray', function(name){
        return function(){ sb.rpc('kds_start_prep', { p_item_name: name }).then(fetchAndRender); };
      });
      renderColumn('colPrepping', itemNames, byItem, 'prepping', 'box-orange', function(name){
        return function(){ sb.rpc('kds_mark_one_ready', { p_item_name: name }).then(fetchAndRender); };
      });
      renderColumn('colReady', itemNames, byItem, 'ready', 'box-green', null);

      previousCounts = byItem;
      isFirstItemRender = false;
    }

    function renderColumn(colId, itemNames, byItem, statusKey, boxClass, makeHandler){
      var col = document.getElementById(colId);
      var label = col.querySelector('.item-col-label');
      col.innerHTML = '';
      col.appendChild(label);

      var any = false;
      itemNames.forEach(function(name){
        var count = byItem[name][statusKey];
        if (count <= 0) return;
        any = true;
        var priorCount = previousCounts[name] ? previousCounts[name][statusKey] : 0;
        var shouldFlash = !isFirstItemRender && count !== priorCount;
        var box = document.createElement('div');
        box.className = 'item-box ' + boxClass + (shouldFlash ? ' flash' : '');
        box.innerHTML = '<span class="nm">' + escHtml(name) + '</span><span class="cnt">x' + count + '</span>';
        if (makeHandler) box.addEventListener('click', makeHandler(name));
        col.appendChild(box);
      });

      if (!any) {
        var hint = document.createElement('div');
        hint.className = 'col-empty-hint';
        hint.textContent = 'Nothing here right now';
        col.appendChild(hint);
      }
    }

    // ---- Right panel: group by order, FIFO (already ordered by the RPC) ----
    var PUSH_FULFILLMENT_URL = 'https://njcmcaoyzujijiyfardx.supabase.co/functions/v1/push-fulfillment-status';
    var KDS_ANON_KEY = 'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_';
    var pushedThisSession = {};

    function pushFulfillmentIfNewlyReady(orderId){
      if (pushedThisSession[orderId]) return;
      pushedThisSession[orderId] = true;
      fetch(PUSH_FULFILLMENT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KDS_ANON_KEY },
        body: JSON.stringify({ orderId: orderId })
      }).catch(function(){
        // Not surfaced to the kitchen screen -- the internal
        // fulfillment_status this board relies on is already correct
        // regardless of whether the push to Square succeeds; a
        // failure here only means the customer's stepper on their
        // own confirmation page won't reflect it. Safe to retry
        // silently next time this order's state is re-rendered.
        pushedThisSession[orderId] = false;
      });
    }

    function renderQueuePanel(rows){
      var listEl = document.getElementById('queueList');
      var orderIds = [];
      var byOrder = {};
      rows.forEach(function(r){
        if (!byOrder[r.order_id]) {
          byOrder[r.order_id] = {
            reference_code: r.reference_code, customer_name: r.customer_name, paymentMethod: r.payment_method,
            createdAt: r.order_created_at, pickupMethod: r.pickup_method, carMake: r.car_make, carColor: r.car_color,
            items: []
          };
          orderIds.push(r.order_id);
        }
        byOrder[r.order_id].items.push({ name: r.item_name, status: r.status });
      });

      if (!orderIds.length) {
        listEl.innerHTML = '<div class="queue-empty-hint">No active orders right now.</div>';
        return;
      }

      listEl.innerHTML = orderIds.map(function(orderId){
        var o = byOrder[orderId];
        var allReady = o.items.every(function(i){ return i.status === 'ready'; });
        if (allReady) pushFulfillmentIfNewlyReady(orderId);
        var pillsHtml = o.items.map(function(i){
          // queued -> red (default), prepping -> orange, ready -> green --
          // previously prepping looked identical to queued (both just
          // "not ready"), which didn't actually show progress.
          var pillClass = i.status === 'ready' ? ' pill-ready' : (i.status === 'prepping' ? ' pill-prepping' : '');
          return '<span class="item-pill' + pillClass + '">' + escHtml(i.name) + '</span>';
        }).join('');
        var isCash = o.paymentMethod === 'cash';
        var isCurbside = o.pickupMethod === 'curbside';
        return '<div class="order-card' + (allReady ? ' order-complete' : '') + (isCash ? ' order-cash' : '') + (isCurbside ? ' order-curbside' : '') + '" data-order-id="' + orderId + '">' +
          '<div class="order-card-head">' +
            '<span class="order-ref">' + escHtml(o.reference_code || '') + '</span>' +
            '<span class="order-name">' + escHtml(o.customer_name || '') + '</span>' +
            '<span class="wait-time" data-created-at="' + escHtml(o.createdAt || '') + '">&mdash;</span>' +
          '</div>' +
          (isCash ? '<div class="cash-warning">Confirm Cash Payment</div>' : '') +
          (isCurbside ? '<div class="curbside-badge">\uD83D\uDE97 Curbside &mdash; ' + escHtml([o.carColor, o.carMake].filter(Boolean).join(' ') || 'car details missing') + '</div>' : '') +
          '<div class="order-pills">' + pillsHtml + '</div>' +
          (allReady ? '<button type="button" class="complete-btn" data-order-id="' + orderId + '">Mark Picked Up</button>' : '') +
        '</div>';
      }).join('');

      listEl.querySelectorAll('.complete-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          btn.disabled = true;
          btn.textContent = 'Marking picked up\u2026';
          sb.rpc('kds_complete_order', { p_order_id: btn.getAttribute('data-order-id') }).then(function(res){
            if (res.error) {
              console.error('kds_complete_order failed:', res.error);
              showBoardError('Could not mark that order picked up \u2014 ' + (res.error.message || 'unknown error'));
              btn.disabled = false;
              btn.textContent = 'Mark Picked Up';
              return;
            }
            fetchAndRender();
          }).catch(function(err){
            console.error('kds_complete_order threw:', err);
            showBoardError("Couldn't reach the server \u2014 check your connection.");
            btn.disabled = false;
            btn.textContent = 'Mark Picked Up';
          });
        });
      });
    }
  })();

  // ---------------- Fryer sub-station clock ----------------
  (function(){
    var el = document.getElementById('fryerBoardClock');
    function tick(){
      var now = new Date();
      el.textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }
    tick();
    setInterval(tick, 15000);
  })();

  // ---------------- Fryer sub-station item filter ----------------
  // EDIT THIS LIST to control exactly what shows up on this screen.
  // Case-insensitive, matches if the item's name CONTAINS any of
  // these words -- so "fries" here catches every Loaded Fries
  // variant and Combo Fries all at once, not just one exact name.
  var FRYER_KEYWORDS = ['falafel', 'samosa', 'fries', 'chips', 'fried'];

  function isFryerItem(row){
    var name = (row.item_name || '').toLowerCase();
    return FRYER_KEYWORDS.some(function(kw){ return name.indexOf(kw) !== -1; });
  }

  // ---------------- Fryer sub-station board data + rendering ----------------
  (function(){
    var realtimeChannel = null;
    var pollTimer = null;
    var previousCounts = {};
    var isFirstItemRender = true;
    var lastFetchAt = null;
    var staleCheckTimer = null;

    window.startFryerBoard = function(){
      fetchAndRender();
      realtimeChannel = sb.channel('kds-fryer-board')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'prep_units' }, fetchAndRender)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, fetchAndRender)
        .subscribe();
      pollTimer = setInterval(fetchAndRender, 20000);
      staleCheckTimer = setInterval(updateLastUpdatedDisplay, 5000);
    };

    window.stopFryerBoard = function(){
      if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (staleCheckTimer) { clearInterval(staleCheckTimer); staleCheckTimer = null; }
      previousCounts = {};
      isFirstItemRender = true;
      lastFetchAt = null;
    };

    function fetchAndRender(){
      sb.rpc('get_kds_board_state').then(function(res){
        if (res.error) {
          console.error('get_kds_board_state failed:', res.error);
          showFryerError('Could not load the board \u2014 ' + (res.error.message || 'unknown error'));
          return;
        }
        if (!res.data) {
          console.error('get_kds_board_state returned no data');
          showFryerError('Board data came back empty \u2014 check the console.');
          return;
        }
        clearFryerError();
        renderFryerItemPanel(res.data.filter(isFryerItem));
        lastFetchAt = Date.now();
        updateLastUpdatedDisplay();
      }).catch(function(err){
        console.error('get_kds_board_state threw:', err);
        showFryerError("Couldn't reach the server \u2014 check your connection.");
      });
    }

    function updateLastUpdatedDisplay(){
      var el = document.getElementById('fryerBoardLastUpdated');
      if (!el || !lastFetchAt) return;
      var secondsAgo = Math.round((Date.now() - lastFetchAt) / 1000);
      var label = secondsAgo < 5 ? 'Updated just now' : 'Updated ' + secondsAgo + 's ago';
      el.textContent = label;
      el.classList.toggle('stale', secondsAgo > 45);
    }

    function showFryerError(msg){
      var el = document.getElementById('fryerBoardErrorBanner');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function clearFryerError(){
      var el = document.getElementById('fryerBoardErrorBanner');
      if (el) el.classList.add('hidden');
    }

    function renderFryerItemPanel(rows){
      var byItem = {};
      rows.forEach(function(r){
        if (r.is_drink) return;
        if (!byItem[r.item_name]) byItem[r.item_name] = { queued: 0, prepping: 0, ready: 0 };
        byItem[r.item_name][r.status] += 1;
      });

      var itemNames = Object.keys(byItem).sort();

      renderFryerColumn('fryerColQueued', itemNames, byItem, 'queued', 'box-gray', function(name){
        return function(){ sb.rpc('kds_start_prep', { p_item_name: name }).then(fetchAndRender); };
      });
      renderFryerColumn('fryerColPrepping', itemNames, byItem, 'prepping', 'box-orange', function(name){
        return function(){ sb.rpc('kds_mark_one_ready', { p_item_name: name }).then(fetchAndRender); };
      });
      renderFryerColumn('fryerColReady', itemNames, byItem, 'ready', 'box-green', null);

      previousCounts = byItem;
      isFirstItemRender = false;
    }

    function renderFryerColumn(colId, itemNames, byItem, statusKey, boxClass, makeHandler){
      var col = document.getElementById(colId);
      var label = col.querySelector('.item-col-label');
      col.innerHTML = '';
      col.appendChild(label);

      var any = false;
      itemNames.forEach(function(name){
        var count = byItem[name][statusKey];
        if (count <= 0) return;
        any = true;
        var priorCount = previousCounts[name] ? previousCounts[name][statusKey] : 0;
        var shouldFlash = !isFirstItemRender && count !== priorCount;
        var box = document.createElement('div');
        box.className = 'item-box ' + boxClass + (shouldFlash ? ' flash' : '');
        box.innerHTML = '<span class="nm">' + escHtml(name) + '</span><span class="cnt">x' + count + '</span>';
        if (makeHandler) box.addEventListener('click', makeHandler(name));
        col.appendChild(box);
      });

      if (!any) {
        var hint = document.createElement('div');
        hint.className = 'col-empty-hint';
        hint.textContent = 'Nothing here right now';
        col.appendChild(hint);
      }
    }
  })();
</script>
