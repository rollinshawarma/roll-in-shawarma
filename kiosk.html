<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Order Here — Roll-In Shawarma</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
  :root{
    --black:#000000;
    --panel:#121110;
    --white:#FFFCF3;
    --cream:#F3EAC9;
    --muted:rgba(243,234,201,0.62);
    --gold:#F7AD28;
    --red:#D8342E;
    --green:#0BAF4C;
    --line:rgba(243,234,201,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html, body{ overflow:hidden; height:100%; width:100%; overscroll-behavior:none; }
  body{
    background:var(--black); color:var(--cream); font-family:'Inter', -apple-system, sans-serif;
    line-height:1.4; user-select:none;
  }
  .hidden{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  input{ font-family:inherit; }

  /* ---------- IDLE / ATTRACT SCREEN ---------- */
  #idleScreen{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px; background:radial-gradient(circle at 50% 30%, rgba(247,173,40,0.14), var(--black) 65%);
  }
  #idleScreen img.logo{ width:180px; height:180px; border-radius:50%; object-fit:cover; margin-bottom:36px; box-shadow:0 0 90px rgba(247,173,40,0.3); }
  #idleScreen h1{ font-size:56px; font-weight:800; color:var(--white); margin-bottom:16px; }
  #idleScreen p{ font-size:22px; color:var(--muted); margin-bottom:48px; }
  #startOrderBtn{
    background:var(--gold); color:#241902; font-size:28px; font-weight:800;
    padding:28px 64px; border-radius:100px; box-shadow:0 20px 50px rgba(247,173,40,0.35);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }

  /* ---------- ORDER SCREEN ---------- */
  #orderScreen{ position:fixed; inset:0; display:flex; flex-direction:column; }
  .kiosk-header{
    display:flex; align-items:center; justify-content:space-between; padding:20px 28px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:none;
  }
  .kiosk-header h2{ font-size:22px; font-weight:800; color:var(--white); }
  #startOverBtn{ background:none; color:var(--muted); font-size:15px; font-weight:600; padding:10px 18px; border:1px solid var(--line); border-radius:100px; }

  #inactivityTimer{
    position:fixed; top:18px; right:24px; z-index:80;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    font-size:13px; font-weight:700; padding:8px 16px; border-radius:100px;
  }

  /* ---------- MENU: single-column collapse/expand, ported from order.html ---------- */
  .menu-wrap{ flex:1; overflow-y:auto; padding:16px 20px 130px; max-width:640px; margin:0 auto; width:100%; }

  .category-block{ border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--panel); }
  .category-row{
    display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
    background:var(--panel); color:var(--white); font-size:19px; font-weight:800; padding:20px 24px;
  }
  .category-row .chev{ color:var(--muted); transition:transform .2s ease; font-size:14px; }
  .category-block.expanded .category-row .chev{ transform:rotate(180deg); }

  .category-expanded{ max-height:0; overflow:hidden; transition:max-height .3s ease; background:var(--black); }
  .category-block.expanded .category-expanded{ max-height:3000px; }

  .category-photo{
    width:100%; max-height:240px; object-fit:contain; display:block;
    background:var(--black); padding:12px 0;
  }

  .item-row{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 24px; border-top:1px solid var(--line);
  }
  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size:16px; font-weight:700; color:var(--cream); }
  .item-desc{ font-size:12.5px; color:var(--muted); margin-top:3px; }
  .item-price{ font-size:15px; font-weight:700; color:var(--gold); margin-top:5px; }
  .item-add-control{ flex:none; }
  .quick-add-btn{
    width:38px; height:38px; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--gold);
    font-size:21px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .quick-add-btn:active{ background:var(--gold); color:#241902; border-color:var(--gold); }
  .item-qty-stepper{ display:flex; align-items:center; gap:11px; }
  .item-qty-btn{ width:32px; height:32px; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--cream); font-size:18px; display:flex; align-items:center; justify-content:center; }
  .item-qty-btn:active{ background:var(--gold); color:#241902; }
  .item-qty-value{ min-width:18px; text-align:center; font-size:16px; font-weight:800; color:var(--white); }
  .empty-hint{ color:var(--muted); font-size:15px; text-align:center; padding:30px 20px; }

  /* persistent cart bar */
  #cartBar{
    position:fixed; left:0; right:0; bottom:0; background:var(--gold); color:#241902;
    display:flex; align-items:center; justify-content:space-between; padding:22px 32px;
    box-shadow:0 -10px 40px rgba(0,0,0,0.4); z-index:50;
  }
  #cartBar.hidden{ display:none !important; }
  #cartBarInfo{ font-size:19px; font-weight:800; }
  #cartBarBtn{ background:#241902; color:var(--gold); font-size:19px; font-weight:800; padding:16px 36px; border-radius:100px; }

  /* ---------- CHECKOUT SCREEN ---------- */
  #checkoutScreen{ position:fixed; inset:0; display:flex; flex-direction:column; background:var(--black); }

  /* ---------- SCAN TO PAY ---------- */
  #scanToPayScreen{
    position:fixed; inset:0; background:var(--black); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:40px; z-index:90;
  }
  #scanToPayScreen h2{ font-size:28px; font-weight:800; color:var(--white); margin-bottom:10px; }
  #scanToPayScreen p{ font-size:17px; color:var(--muted); max-width:420px; margin-bottom:32px; }
  #qrCodeCanvas{ background:var(--white); padding:20px; border-radius:20px; margin-bottom:28px; }
  .scan-total{ font-size:22px; font-weight:800; color:var(--gold); margin-bottom:32px; }
  .scan-waiting{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; margin-bottom:28px; }
  .scan-waiting .spin{
    width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--gold);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #scanPayCashBtn{ background:none; color:var(--muted); font-size:14.5px; text-decoration:underline; }
  #scanCancelBtn{ background:none; color:var(--muted); font-size:14px; margin-top:16px; }
  .checkout-body{ flex:1; overflow-y:auto; padding:32px; max-width:560px; margin:0 auto; width:100%; }
  .checkout-body h2{ font-size:28px; font-weight:800; color:var(--white); margin-bottom:24px; text-align:center; }
  .checkout-items-list{ border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:24px; }
  .checkout-item-row{ display:flex; justify-content:space-between; padding:8px 0; font-size:15px; }
  .checkout-item-row .nm{ color:var(--white); }
  .checkout-item-row .amt{ color:var(--muted); }
  .checkout-total-row{ display:flex; justify-content:space-between; font-size:20px; font-weight:800; color:var(--white); padding-top:14px; margin-top:8px; border-top:1px solid var(--line); }
  .checkout-total-row span{ color:var(--gold); }

  .kiosk-field{ margin-bottom:20px; }
  .kiosk-field label{ display:block; font-size:14px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px; }
  .kiosk-field input{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:18px 16px; color:var(--white); font-size:20px;
  }
  .kiosk-field input:focus{ outline:none; border-color:var(--gold); }
  .kiosk-field input:disabled{ opacity:0.4; }
  .skip-email-btn{ background:none; color:var(--muted); font-size:14px; font-weight:600; margin-top:8px; text-decoration:underline; }

  .checkout-footer{ flex:none; padding:24px 32px; border-top:1px solid var(--line); max-width:560px; margin:0 auto; width:100%; }
  #kioskPayBtn{ width:100%; background:var(--gold); color:#241902; font-size:22px; font-weight:800; padding:22px; border-radius:16px; }
  #kioskPayBtn:disabled{ opacity:0.6; }
  #kioskBackBtn{ display:block; margin:16px auto 0; background:none; color:var(--muted); font-size:15px; }
  #kioskCheckoutMsg{ text-align:center; font-size:14px; color:var(--red); min-height:20px; margin-top:12px; }

  @media (max-width:600px){
    #idleScreen h1{ font-size:38px; }
    #idleScreen p{ font-size:17px; }
    #startOrderBtn{ font-size:22px; padding:22px 48px; }
  }
</style>
</head>
<body>

<div id="inactivityTimer" class="hidden"></div>

<div id="idleScreen">
  <img class="logo" src="logo.jpg" alt="Roll-In Shawarma">
  <h1>Roll-In Shawarma</h1>
  <p>Middle Eastern &amp; Indian fusion, made fresh to order.</p>
  <button type="button" id="startOrderBtn">Tap to Start Your Order</button>
</div>

<div id="orderScreen" class="hidden">
  <div class="kiosk-header">
    <h2>Build Your Order</h2>
    <button type="button" id="startOverBtn">Start Over</button>
  </div>
  <div class="menu-wrap">
    <div id="categoryList"></div>
  </div>
  <div id="cartBar" class="hidden">
    <div id="cartBarInfo">0 items &middot; $0.00</div>
    <button type="button" id="cartBarBtn">Checkout &rarr;</button>
  </div>
</div>

<div id="checkoutScreen" class="hidden">
  <div class="checkout-body">
    <h2>Almost there!</h2>
    <div class="checkout-items-list" id="checkoutItemsList"></div>
    <div class="checkout-total-row">Total <span id="checkoutTotalDisplay">$0.00</span></div>

    <div class="kiosk-field" style="margin-top:28px;">
      <label>Name (so we can call you)</label>
      <input type="text" id="kioskName" placeholder="Your first name">
    </div>
    <div class="kiosk-field">
      <label>Email (optional)</label>
      <input type="email" id="kioskEmail" placeholder="For a receipt">
      <button type="button" class="skip-email-btn" id="skipEmailBtn">Skip &mdash; I'll just get my order number</button>
    </div>
  </div>
  <div class="checkout-footer">
    <button type="button" id="kioskPayBtn">Pay Now</button>
    <div id="kioskCheckoutMsg"></div>
    <button type="button" id="kioskBackBtn">&larr; Back to menu</button>
  </div>
</div>

<div id="scanToPayScreen" class="hidden">
  <h2>Scan to Pay</h2>
  <p>Scan this code with your phone to pay with Apple Pay, Google Pay, or card.</p>
  <canvas id="qrCodeCanvas"></canvas>
  <div class="scan-total">Total: <span id="scanTotalDisplay">$0.00</span></div>
  <div class="scan-waiting"><span class="spin"></span> Waiting for payment&hellip;</div>
  <button type="button" id="scanPayCashBtn">I'll pay cash at the window &rarr;</button>
  <button type="button" id="scanCancelBtn">&larr; Back to checkout</button>
</div>

<script>
  var sbShared = supabase.createClient(
    'https://njcmcaoyzujijiyfardx.supabase.co',
    'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_'
  );

  (function(){
    var idleScreen = document.getElementById('idleScreen');
    var orderScreen = document.getElementById('orderScreen');
    var checkoutScreen = document.getElementById('checkoutScreen');

    var cart = []; // in-memory only, on purpose -- a shared device should never
                    // carry a previous customer's order into the next one
    var itemsById = {};
    var categoryOrder = [];

    var categoryImages = {
      'Shawarma': 'menu-shawarma.jpg', 'Frankie Rolls': 'menu-frankie.jpg',
      'Bowls': 'menu-bowl.jpg', 'Tacos': 'menu-tacos.jpg',
      'Loaded Fries': 'menu-fries.jpg', 'Sides': 'menu-samosas.jpg',
      'Kulfi Ice Cream': 'menu-kulfi.jpg', 'Drinks': 'menu-falooda.jpg'
    };

    function escHtml(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    // ---- Inactivity auto-reset: if someone walks away mid-order,
    // return to the idle screen after a timeout so the next customer
    // never sees (or accidentally pays for) a stranger's cart. Stays
    // silent at first -- only shows a visible warning in the final
    // stretch, not the whole time. Any touch resets it back to full. ----
    var INACTIVITY_LIMIT_SECONDS = 60;
    var VISIBLE_WARNING_SECONDS = 15;
    var secondsRemaining = INACTIVITY_LIMIT_SECONDS;
    var inactivityInterval = null;

    function updateInactivityDisplay(){
      var el = document.getElementById('inactivityTimer');
      if (!el) return;
      var shouldShow = idleScreen.classList.contains('hidden') && secondsRemaining <= VISIBLE_WARNING_SECONDS;
      if (shouldShow) {
        el.classList.remove('hidden');
        el.textContent = 'Resetting in ' + secondsRemaining + 's';
      } else {
        el.classList.add('hidden');
      }
    }

    function startInactivityCountdown(){
      clearInterval(inactivityInterval);
      if (idleScreen.classList.contains('hidden')) {
        inactivityInterval = setInterval(function(){
          secondsRemaining -= 1;
          updateInactivityDisplay();
          if (secondsRemaining <= 0) {
            clearInterval(inactivityInterval);
            window.location.reload();
          }
        }, 1000);
      }
      updateInactivityDisplay();
    }

    function resetInactivityTimer(){
      secondsRemaining = INACTIVITY_LIMIT_SECONDS;
      startInactivityCountdown();
    }
    ['touchstart','mousedown','keydown'].forEach(function(evt){
      document.addEventListener(evt, resetInactivityTimer, { passive: true });
    });

    // ---- Fetch menu (excluding Catering -- that's a planned-ahead
    // flow, not a walk-up kiosk purchase) ----
    function loadMenu(){
      sbShared.from('menu_items').select('*').order('display_order').then(function(res){
        if (res.error || !res.data) return;
        var byCategory = {};
        res.data.forEach(function(item){
          itemsById[item.id] = item;
          if (item.category === 'Catering') return;
          if (!byCategory[item.category]) {
            byCategory[item.category] = [];
            categoryOrder.push(item.category);
          }
          byCategory[item.category].push(item);
        });
        window.__kioskByCategory = byCategory;
        renderCategoryList();
      });
    }

    var expandedCategory = null;

    // Categories render collapsed by default -- name only, no photo,
    // no items. A photo only ever appears once a category is
    // actually expanded, and collapses away again when it's closed.
    function renderCategoryList(){
      var listEl = document.getElementById('categoryList');
      if (!categoryOrder.length) {
        listEl.innerHTML = '<div class="empty-hint">Menu is loading, one moment&hellip;</div>';
        return;
      }

      listEl.innerHTML = categoryOrder.map(function(cat){
        return '<div class="category-block" data-cat="' + escHtml(cat) + '">' +
          '<button type="button" class="category-row" data-cat="' + escHtml(cat) + '">' +
            escHtml(cat) + '<span class="chev">\u25BC</span>' +
          '</button>' +
          '<div class="category-expanded" data-cat="' + escHtml(cat) + '"></div>' +
        '</div>';
      }).join('');

      listEl.querySelectorAll('.category-row').forEach(function(btn){
        btn.addEventListener('click', function(){ toggleCategory(btn.getAttribute('data-cat')); });
      });
    }

    // Only one category open at a time -- opening a new one collapses
    // whatever was previously open, back to the plain category list.
    function toggleCategory(cat){
      var wasExpanded = expandedCategory === cat;

      document.querySelectorAll('.category-block').forEach(function(block){
        block.classList.remove('expanded');
      });

      if (wasExpanded) {
        expandedCategory = null;
        return;
      }

      expandedCategory = cat;
      var block = document.querySelector('.category-block[data-cat="' + cssEscape(cat) + '"]');
      if (block) block.classList.add('expanded');

      renderCategoryContent(cat);
    }

    function cssEscape(s){ return String(s).replace(/"/g, '\\"'); }

    function renderCategoryContent(cat){
      var contentEl = document.querySelector('.category-expanded[data-cat="' + cssEscape(cat) + '"]');
      if (!contentEl) return;
      var items = (window.__kioskByCategory[cat] || []);
      var img = categoryImages[cat] || 'menu-shawarma.jpg';

      var rowsHtml = items.map(function(item){
        var label = item.name + (item.variant_name ? ' \u2014 ' + item.variant_name : '');
        return '<div class="item-row">' +
          '<div class="item-info">' +
            '<div class="item-name">' + escHtml(label) + '</div>' +
            (item.description ? '<div class="item-desc">' + escHtml(item.description) + '</div>' : '') +
            '<div class="item-price">$' + Number(item.price).toFixed(2) + '</div>' +
          '</div>' +
          '<div class="item-add-control" data-id="' + item.id + '"></div>' +
        '</div>';
      }).join('');

      contentEl.innerHTML = '<img class="category-photo" src="' + img + '" alt="' + escHtml(cat) + '">' + rowsHtml;

      items.forEach(function(item){ renderItemControl(item.id); });
    }

    function renderItemControl(itemId){
      var controlEl = document.querySelector('.item-add-control[data-id="' + itemId + '"]');
      if (!controlEl) return;
      var line = findLine(itemId);

      if (!line) {
        controlEl.innerHTML = '<button type="button" class="quick-add-btn" data-id="' + itemId + '">+</button>';
        controlEl.querySelector('.quick-add-btn').addEventListener('click', function(){ addOne(itemId); });
      } else {
        controlEl.innerHTML =
          '<div class="item-qty-stepper">' +
            '<button type="button" class="item-qty-btn" data-id="' + itemId + '" data-dir="-1">\u2212</button>' +
            '<span class="item-qty-value">' + line.quantity + '</span>' +
            '<button type="button" class="item-qty-btn" data-id="' + itemId + '" data-dir="1">+</button>' +
          '</div>';
        controlEl.querySelectorAll('.item-qty-btn').forEach(function(btn){
          btn.addEventListener('click', function(){
            if (btn.getAttribute('data-dir') === '1') addOne(itemId); else removeOne(itemId);
          });
        });
      }
    }

    function findLine(itemId){ return cart.find(function(c){ return c.menu_item_id === itemId; }); }

    function addOne(itemId){
      var item = itemsById[itemId];
      if (!item) return;
      var line = findLine(itemId);
      if (line) {
        line.quantity += 1;
      } else {
        var label = item.name + (item.variant_name ? ' \u2014 ' + item.variant_name : '');
        cart.push({ menu_item_id: itemId, name: label, unitPrice: Number(item.price), quantity: 1 });
      }
      renderCartBar();
      renderItemControl(itemId);
    }

    function removeOne(itemId){
      var item = itemsById[itemId];
      var line = findLine(itemId);
      if (!line) return;
      var minQty = item && item.min_quantity;
      if (minQty && line.quantity <= minQty) {
        cart = cart.filter(function(c){ return c.menu_item_id !== itemId; });
      } else {
        line.quantity -= 1;
        if (line.quantity <= 0) cart = cart.filter(function(c){ return c.menu_item_id !== itemId; });
      }
      renderCartBar();
      renderItemControl(itemId);
    }

    function cartTotal(){ return cart.reduce(function(sum, c){ return sum + c.unitPrice * c.quantity; }, 0); }
    function cartCount(){ return cart.reduce(function(sum, c){ return sum + c.quantity; }, 0); }

    function renderCartBar(){
      var bar = document.getElementById('cartBar');
      var count = cartCount();
      if (count === 0) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      document.getElementById('cartBarInfo').textContent = count + ' item' + (count === 1 ? '' : 's') + ' \u00b7 $' + cartTotal().toFixed(2);
    }

    // ---- Screen navigation ----
    function goToOrderScreen(){
      idleScreen.classList.add('hidden');
      checkoutScreen.classList.add('hidden');
      orderScreen.classList.remove('hidden');
      resetInactivityTimer();
    }
    function goToCheckoutScreen(){
      if (!cart.length) return;
      orderScreen.classList.add('hidden');
      checkoutScreen.classList.remove('hidden');
      document.getElementById('checkoutItemsList').innerHTML = cart.map(function(c){
        return '<div class="checkout-item-row"><span class="nm">' + escHtml(c.name) + ' &times; ' + c.quantity + '</span>' +
          '<span class="amt">$' + (c.unitPrice * c.quantity).toFixed(2) + '</span></div>';
      }).join('');
      document.getElementById('checkoutTotalDisplay').textContent = '$' + cartTotal().toFixed(2);
      resetInactivityTimer();
    }

    document.getElementById('startOrderBtn').addEventListener('click', goToOrderScreen);
    document.getElementById('startOverBtn').addEventListener('click', function(){ window.location.reload(); });
    document.getElementById('cartBarBtn').addEventListener('click', goToCheckoutScreen);
    document.getElementById('kioskBackBtn').addEventListener('click', function(){
      checkoutScreen.classList.add('hidden');
      orderScreen.classList.remove('hidden');
    });

    var emailSkipped = false;
    document.getElementById('skipEmailBtn').addEventListener('click', function(){
      var emailInput = document.getElementById('kioskEmail');
      emailSkipped = !emailSkipped;
      if (emailSkipped) {
        emailInput.value = '';
        emailInput.disabled = true;
        this.textContent = 'Email skipped \u2014 tap to add one instead';
      } else {
        emailInput.disabled = false;
        this.textContent = "Skip \u2014 I'll just get my order number";
      }
    });

    // ---- Checkout / payment ----
    var KIOSK_EDGE_FUNCTION_URL = 'https://njcmcaoyzujijiyfardx.supabase.co/functions/v1/create-order-checkout';
    var CASH_ORDER_URL = 'https://njcmcaoyzujijiyfardx.supabase.co/functions/v1/create-cash-order';
    var CONFIRMATION_URL = 'https://njcmcaoyzujijiyfardx.supabase.co/functions/v1/get-order-confirmation';
    var KIOSK_ANON_KEY = 'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_';

    var scanToPayScreen = document.getElementById('scanToPayScreen');
    var pollTimer = null;
    var pollAttempts = 0;
    var POLL_INTERVAL_MS = 2500;
    var POLL_MAX_ATTEMPTS = 120; // ~5 minutes

    function stopPolling(){
      clearTimeout(pollTimer);
      pollTimer = null;
      pollAttempts = 0;
    }

    function pollForPayment(referenceCode){
      pollAttempts += 1;
      fetch(CONFIRMATION_URL + '?ref=' + encodeURIComponent(referenceCode), {
        headers: { 'Authorization': 'Bearer ' + KIOSK_ANON_KEY }
      }).then(function(res){ return res.json(); })
        .then(function(order){
          if (order && order.status === 'paid') {
            stopPolling();
            window.location.href = 'kiosk-thank-you.html?ref=' + encodeURIComponent(referenceCode);
            return;
          }
          if (pollAttempts >= POLL_MAX_ATTEMPTS) {
            stopPolling();
            var waitEl = document.querySelector('.scan-waiting');
            if (waitEl) waitEl.innerHTML = "Still waiting &mdash; you can keep waiting, or go back and try paying here on the kiosk instead.";
            return;
          }
          pollTimer = setTimeout(function(){ pollForPayment(referenceCode); }, POLL_INTERVAL_MS);
        })
        .catch(function(){
          if (pollAttempts < POLL_MAX_ATTEMPTS) {
            pollTimer = setTimeout(function(){ pollForPayment(referenceCode); }, POLL_INTERVAL_MS);
          }
        });
    }

    function showQrFallback(canvasWrap, checkoutUrl){
      var canvas = document.getElementById('qrCodeCanvas');
      canvas.classList.add('hidden');
      var existing = document.getElementById('qrFallbackLink');
      if (existing) existing.remove();
      var fallback = document.createElement('a');
      fallback.id = 'qrFallbackLink';
      fallback.href = checkoutUrl;
      fallback.textContent = 'Tap here to pay';
      fallback.style.cssText = 'display:block; background:var(--gold); color:#241902; font-size:18px; font-weight:800; padding:22px 40px; border-radius:16px; margin-bottom:28px;';
      canvasWrap.insertBefore(fallback, canvas);
    }

    function showScanToPay(checkoutUrl, referenceCode, total){
      checkoutScreen.classList.add('hidden');
      scanToPayScreen.classList.remove('hidden');
      document.getElementById('scanTotalDisplay').textContent = '$' + Number(total).toFixed(2);
      document.querySelector('.scan-waiting').innerHTML = '<span class="spin"></span> Waiting for payment&hellip;';

      // Everything below is critical -- it must run regardless of
      // whether QR generation (further down) succeeds or fails, so a
      // rendering problem with the code can never also break the
      // ability to pay on the kiosk directly or go back.

      // While waiting for a phone-based payment, the customer isn't
      // touching the kiosk on purpose -- that's expected here, not
      // abandonment, so the normal inactivity auto-reset is paused
      // for as long as this screen is showing.
      clearInterval(inactivityInterval);
      document.getElementById('inactivityTimer').classList.add('hidden');

      document.getElementById('scanPayCashBtn').onclick = function(){
        var cashBtn = this;
        stopPolling();
        cashBtn.disabled = true;
        cashBtn.textContent = 'One moment\u2026';

        var itemsPayload = cart.map(function(c){
          return { menu_item_id: c.menu_item_id, quantity: c.quantity, name: c.name };
        });
        var name = document.getElementById('kioskName').value.trim();
        var email = document.getElementById('kioskEmail').value.trim();

        fetch(CASH_ORDER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KIOSK_ANON_KEY },
          body: JSON.stringify({
            items: itemsPayload,
            customerName: name || 'Kiosk Guest',
            customerEmail: email || undefined
          })
        }).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
          .then(function(result){
            if (!result.ok) {
              cashBtn.disabled = false;
              cashBtn.textContent = "I'll pay cash at the window \u2192";
              return;
            }
            window.location.href = 'kiosk-thank-you.html?ref=' + encodeURIComponent(result.data.referenceCode) + '&cash=true';
          })
          .catch(function(){
            cashBtn.disabled = false;
            cashBtn.textContent = "I'll pay cash at the window \u2192";
          });
      };
      document.getElementById('scanCancelBtn').onclick = function(){
        stopPolling();
        scanToPayScreen.classList.add('hidden');
        checkoutScreen.classList.remove('hidden');
        resetInactivityTimer();
      };

      pollForPayment(referenceCode);

      // QR generation is isolated here on purpose -- if it fails for
      // any reason (library didn't load, canvas issue, etc.), the
      // customer still has a tappable link to pay with, and every
      // button above still works either way.
      var canvasWrap = document.getElementById('qrCodeCanvas').parentElement;
      try {
        if (typeof QRCode === 'undefined') throw new Error('QR library not loaded');
        var canvas = document.getElementById('qrCodeCanvas');
        canvas.classList.remove('hidden');
        QRCode.toCanvas(canvas, checkoutUrl, { width: 240, margin: 1 }, function(err){
          if (err) showQrFallback(canvasWrap, checkoutUrl);
        });
      } catch (e) {
        showQrFallback(canvasWrap, checkoutUrl);
      }
    }

    document.getElementById('kioskPayBtn').addEventListener('click', function(){
      var payBtn = this;
      var msgEl = document.getElementById('kioskCheckoutMsg');
      var name = document.getElementById('kioskName').value.trim();
      var email = document.getElementById('kioskEmail').value.trim();

      msgEl.textContent = '';

      if (!cart.length) {
        msgEl.textContent = 'Your cart is empty.';
        return;
      }

      payBtn.disabled = true;
      payBtn.textContent = 'Preparing checkout\u2026';

      var itemsPayload = cart.map(function(c){
        return { menu_item_id: c.menu_item_id, quantity: c.quantity, name: c.name };
      });

      fetch(KIOSK_EDGE_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KIOSK_ANON_KEY },
        body: JSON.stringify({
          items: itemsPayload,
          customerName: name || 'Kiosk Guest',
          customerEmail: email || undefined,
          orderSource: 'kiosk'
        })
      }).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
        .then(function(result){
          payBtn.disabled = false;
          payBtn.textContent = 'Pay Now';
          if (!result.ok || !result.data.url) {
            msgEl.textContent = (result.data && result.data.error) ? String(result.data.error) : "Couldn't start checkout \u2014 please ask for help.";
            return;
          }
          showScanToPay(result.data.url, result.data.referenceCode, result.data.total);
        })
        .catch(function(){
          payBtn.disabled = false;
          payBtn.textContent = 'Pay Now';
          msgEl.textContent = "Couldn't reach checkout \u2014 please ask for help.";
        });
    });

    loadMenu();
  })();
</script>
