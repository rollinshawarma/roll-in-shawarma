<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Order Here — Roll-In Shawarma</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --black:#000000;
    --panel:#121110;
    --white:#FFFCF3;
    --cream:#F3EAC9;
    --muted:rgba(243,234,201,0.62);
    --gold:#F7AD28;
    --red:#D8342E;
    --green:#0BAF4C;
    --line:rgba(243,234,201,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html, body{ overflow:hidden; height:100%; width:100%; overscroll-behavior:none; }
  body{
    background:var(--black); color:var(--cream); font-family:'Inter', -apple-system, sans-serif;
    line-height:1.4; user-select:none;
  }
  .hidden{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  input{ font-family:inherit; }

  /* ---------- IDLE / ATTRACT SCREEN ---------- */
  #idleScreen{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px; background:radial-gradient(circle at 50% 30%, rgba(247,173,40,0.14), var(--black) 65%);
  }
  #idleScreen img.logo{ width:180px; height:180px; border-radius:50%; object-fit:cover; margin-bottom:36px; box-shadow:0 0 90px rgba(247,173,40,0.3); }
  #idleScreen h1{ font-size:56px; font-weight:800; color:var(--white); margin-bottom:16px; }
  #idleScreen p{ font-size:22px; color:var(--muted); margin-bottom:48px; }
  #startOrderBtn{
    background:var(--gold); color:#241902; font-size:28px; font-weight:800;
    padding:28px 64px; border-radius:100px; box-shadow:0 20px 50px rgba(247,173,40,0.35);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }

  /* ---------- ORDER SCREEN ---------- */
  #orderScreen{ position:fixed; inset:0; display:flex; flex-direction:column; }
  .kiosk-header{
    display:flex; align-items:center; justify-content:space-between; padding:20px 28px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:none;
  }
  .kiosk-header h2{ font-size:22px; font-weight:800; color:var(--white); }
  #startOverBtn{ background:none; color:var(--muted); font-size:15px; font-weight:600; padding:10px 18px; border:1px solid var(--line); border-radius:100px; }

  /* ---------- MENU: vertical category sidebar + single image panel ---------- */
  .menu-split{ flex:1; display:flex; overflow:hidden; padding-bottom:110px; }

  .category-sidebar{ width:30%; min-width:220px; border-right:1px solid var(--line); overflow-y:auto; background:var(--panel); flex:none; }

  .category-block{ border-bottom:1px solid var(--line); }
  .category-row{
    display:block; width:100%; text-align:left; background:none; color:var(--cream);
    font-size:19px; font-weight:700; padding:24px 26px;
  }
  .category-row.active{ background:var(--gold); color:#241902; }

  .category-options{ max-height:0; overflow:hidden; transition:max-height .3s ease; background:var(--black); }
  .category-block.expanded .category-options{ max-height:1000px; }
  .option-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 20px 16px 34px; border-top:1px solid var(--line);
  }
  .option-row.selected{ background:rgba(247,173,40,0.08); }
  .option-info{ flex:1; min-width:0; cursor:pointer; }
  .option-name{ font-size:15.5px; font-weight:700; color:var(--cream); }
  .option-row.selected .option-name{ color:var(--gold); }
  .option-price{ font-size:13.5px; color:var(--muted); margin-top:2px; }
  .option-qty-controls{ display:flex; align-items:center; gap:10px; flex:none; }
  .option-qty-btn{
    width:34px; height:34px; border-radius:50%; background:var(--panel); border:1px solid var(--line);
    color:var(--cream); font-size:18px; display:flex; align-items:center; justify-content:center;
  }
  .option-qty-btn:active{ background:var(--gold); color:#241902; }
  .option-qty-value{ min-width:20px; text-align:center; font-size:15px; font-weight:800; color:var(--white); }

  .item-detail-panel{ flex:1; overflow-y:auto; padding:36px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .item-detail-photo{
    width:100%; max-width:440px; aspect-ratio:1.3; border-radius:20px; object-fit:cover;
    margin-bottom:18px; background:var(--panel);
  }
  .item-detail-caption{ font-size:22px; font-weight:800; color:var(--white); text-align:center; }
  .item-detail-empty{ color:var(--muted); font-size:17px; text-align:center; }

  /* persistent cart bar */
  #cartBar{
    position:fixed; left:0; right:0; bottom:0; background:var(--gold); color:#241902;
    display:flex; align-items:center; justify-content:space-between; padding:22px 32px;
    box-shadow:0 -10px 40px rgba(0,0,0,0.4); z-index:50;
  }
  #cartBar.hidden{ display:none !important; }
  #cartBarInfo{ font-size:19px; font-weight:800; }
  #cartBarBtn{ background:#241902; color:var(--gold); font-size:19px; font-weight:800; padding:16px 36px; border-radius:100px; }

  /* ---------- CHECKOUT SCREEN ---------- */
  #checkoutScreen{ position:fixed; inset:0; display:flex; flex-direction:column; background:var(--black); }
  .checkout-body{ flex:1; overflow-y:auto; padding:32px; max-width:560px; margin:0 auto; width:100%; }
  .checkout-body h2{ font-size:28px; font-weight:800; color:var(--white); margin-bottom:24px; text-align:center; }
  .checkout-items-list{ border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:24px; }
  .checkout-item-row{ display:flex; justify-content:space-between; padding:8px 0; font-size:15px; }
  .checkout-item-row .nm{ color:var(--white); }
  .checkout-item-row .amt{ color:var(--muted); }
  .checkout-total-row{ display:flex; justify-content:space-between; font-size:20px; font-weight:800; color:var(--white); padding-top:14px; margin-top:8px; border-top:1px solid var(--line); }
  .checkout-total-row span{ color:var(--gold); }

  .kiosk-field{ margin-bottom:20px; }
  .kiosk-field label{ display:block; font-size:14px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px; }
  .kiosk-field input{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:18px 16px; color:var(--white); font-size:20px;
  }
  .kiosk-field input:focus{ outline:none; border-color:var(--gold); }
  .kiosk-field input:disabled{ opacity:0.4; }
  .skip-email-btn{ background:none; color:var(--muted); font-size:14px; font-weight:600; margin-top:8px; text-decoration:underline; }

  .checkout-footer{ flex:none; padding:24px 32px; border-top:1px solid var(--line); max-width:560px; margin:0 auto; width:100%; }
  #kioskPayBtn{ width:100%; background:var(--gold); color:#241902; font-size:22px; font-weight:800; padding:22px; border-radius:16px; }
  #kioskPayBtn:disabled{ opacity:0.6; }
  #kioskBackBtn{ display:block; margin:16px auto 0; background:none; color:var(--muted); font-size:15px; }
  #kioskCheckoutMsg{ text-align:center; font-size:14px; color:var(--red); min-height:20px; margin-top:12px; }

  @media (max-width:820px){
    .menu-split{ flex-direction:column; }
    .category-sidebar{ width:100%; max-height:30%; border-right:none; border-bottom:1px solid var(--line); }
    #idleScreen h1{ font-size:38px; }
    #idleScreen p{ font-size:17px; }
    #startOrderBtn{ font-size:22px; padding:22px 48px; }
  }
</style>
</head>
<body>

<div id="idleScreen">
  <img class="logo" src="logo.jpg" alt="Roll-In Shawarma">
  <h1>Roll-In Shawarma</h1>
  <p>Middle Eastern &amp; Indian fusion, made fresh to order.</p>
  <button type="button" id="startOrderBtn">Tap to Start Your Order</button>
</div>

<div id="orderScreen" class="hidden">
  <div class="kiosk-header">
    <h2>Build Your Order</h2>
    <button type="button" id="startOverBtn">Start Over</button>
  </div>
  <div class="menu-split">
    <div class="category-sidebar" id="categorySidebar"></div>
    <div class="item-detail-panel" id="itemDetailPanel">
      <div class="item-detail-empty">Select a category to get started.</div>
    </div>
  </div>
  <div id="cartBar" class="hidden">
    <div id="cartBarInfo">0 items &middot; $0.00</div>
    <button type="button" id="cartBarBtn">Checkout &rarr;</button>
  </div>
</div>

<div id="checkoutScreen" class="hidden">
  <div class="checkout-body">
    <h2>Almost there!</h2>
    <div class="checkout-items-list" id="checkoutItemsList"></div>
    <div class="checkout-total-row">Total <span id="checkoutTotalDisplay">$0.00</span></div>

    <div class="kiosk-field" style="margin-top:28px;">
      <label>Name (so we can call you)</label>
      <input type="text" id="kioskName" placeholder="Your first name">
    </div>
    <div class="kiosk-field">
      <label>Email (optional)</label>
      <input type="email" id="kioskEmail" placeholder="For a receipt">
      <button type="button" class="skip-email-btn" id="skipEmailBtn">Skip &mdash; I'll just get my order number</button>
    </div>
  </div>
  <div class="checkout-footer">
    <button type="button" id="kioskPayBtn">Pay Now</button>
    <div id="kioskCheckoutMsg"></div>
    <button type="button" id="kioskBackBtn">&larr; Back to menu</button>
  </div>
</div>

<script>
  var sbShared = supabase.createClient(
    'https://njcmcaoyzujijiyfardx.supabase.co',
    'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_'
  );

  (function(){
    var idleScreen = document.getElementById('idleScreen');
    var orderScreen = document.getElementById('orderScreen');
    var checkoutScreen = document.getElementById('checkoutScreen');

    var cart = []; // in-memory only, on purpose -- a shared device should never
                    // carry a previous customer's order into the next one
    var itemsById = {};
    var categoryOrder = [];

    var categoryImages = {
      'Shawarma': 'menu-shawarma.jpg', 'Frankie Rolls': 'menu-frankie.jpg',
      'Bowls': 'menu-bowl.jpg', 'Tacos': 'menu-tacos.jpg',
      'Loaded Fries': 'menu-fries.jpg', 'Sides': 'menu-samosas.jpg',
      'Kulfi Ice Cream': 'menu-kulfi.jpg', 'Drinks': 'menu-falooda.jpg'
    };

    function escHtml(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    // ---- Inactivity auto-reset: if someone walks away mid-order,
    // return to the idle screen after a timeout so the next customer
    // never sees (or accidentally pays for) a stranger's cart. ----
    var INACTIVITY_LIMIT_MS = 90 * 1000;
    var inactivityTimer = null;
    function resetInactivityTimer(){
      clearTimeout(inactivityTimer);
      if (!idleScreen.classList.contains('hidden')) return;
      inactivityTimer = setTimeout(function(){ window.location.reload(); }, INACTIVITY_LIMIT_MS);
    }
    ['touchstart','mousedown','keydown'].forEach(function(evt){
      document.addEventListener(evt, resetInactivityTimer, { passive: true });
    });

    // ---- Fetch menu (excluding Catering -- that's a planned-ahead
    // flow, not a walk-up kiosk purchase) ----
    function loadMenu(){
      sbShared.from('menu_items').select('*').order('display_order').then(function(res){
        if (res.error || !res.data) return;
        var byCategory = {};
        res.data.forEach(function(item){
          itemsById[item.id] = item;
          if (item.category === 'Catering') return;
          if (!byCategory[item.category]) {
            byCategory[item.category] = [];
            categoryOrder.push(item.category);
          }
          byCategory[item.category].push(item);
        });
        window.__kioskByCategory = byCategory;
        renderCategorySidebar();
      });
    }

    var expandedCategory = null;
    var viewedItemId = null; // whichever option's photo is currently shown on the right

    function renderCategorySidebar(){
      var sidebarEl = document.getElementById('categorySidebar');
      sidebarEl.innerHTML = categoryOrder.map(function(cat){
        var items = (window.__kioskByCategory || {})[cat] || [];
        var optionsHtml = items.map(function(item){
          var label = item.name + (item.variant_name ? ' \u2014 ' + item.variant_name : '');
          return '<div class="option-row" data-id="' + item.id + '">' +
            '<div class="option-info" data-id="' + item.id + '">' +
              '<div class="option-name">' + escHtml(label) + '</div>' +
              '<div class="option-price">$' + Number(item.price).toFixed(2) + '</div>' +
            '</div>' +
            '<div class="option-qty-controls">' +
              '<button type="button" class="option-qty-btn" data-id="' + item.id + '" data-dir="-1">\u2212</button>' +
              '<span class="option-qty-value" data-id="' + item.id + '">0</span>' +
              '<button type="button" class="option-qty-btn" data-id="' + item.id + '" data-dir="1">+</button>' +
            '</div>' +
          '</div>';
        }).join('');

        return '<div class="category-block" data-cat="' + escHtml(cat) + '">' +
          '<button type="button" class="category-row" data-cat="' + escHtml(cat) + '">' + escHtml(cat) + '</button>' +
          '<div class="category-options">' + optionsHtml + '</div>' +
        '</div>';
      }).join('');

      sidebarEl.querySelectorAll('.category-row').forEach(function(btn){
        btn.addEventListener('click', function(){ toggleCategory(btn.getAttribute('data-cat')); });
      });
      sidebarEl.querySelectorAll('.option-info').forEach(function(el){
        el.addEventListener('click', function(){ viewItem(el.getAttribute('data-id')); });
      });
      sidebarEl.querySelectorAll('.option-qty-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var id = btn.getAttribute('data-id');
          if (btn.getAttribute('data-dir') === '1') addOne(id); else removeOne(id);
          viewItem(id); // adding/removing also brings that item's photo into view
        });
      });
    }

    // Only one category expanded at a time -- selecting a new one
    // collapses whatever was open before.
    function toggleCategory(cat){
      var wasExpanded = expandedCategory === cat;
      document.querySelectorAll('.category-block').forEach(function(block){
        block.classList.remove('expanded');
      });
      document.querySelectorAll('.category-row').forEach(function(btn){
        btn.classList.remove('active');
      });
      if (wasExpanded) {
        expandedCategory = null;
        return;
      }
      expandedCategory = cat;
      var block = document.querySelector('.category-block[data-cat="' + cssEscape(cat) + '"]');
      if (block) block.classList.add('expanded');
      var row = document.querySelector('.category-row[data-cat="' + cssEscape(cat) + '"]');
      if (row) row.classList.add('active');
    }

    function cssEscape(s){ return String(s).replace(/"/g, '\\"'); }

    // Shows just the photo for one specific option -- the detail
    // panel never shows anything else (no name/price/buttons there;
    // those all live inline on the option row itself).
    function viewItem(itemId){
      viewedItemId = itemId;
      var item = itemsById[itemId];
      if (!item) return;

      document.querySelectorAll('.option-row').forEach(function(row){
        row.classList.toggle('selected', row.getAttribute('data-id') === itemId);
      });

      var label = item.name + (item.variant_name ? ' \u2014 ' + item.variant_name : '');
      var img = categoryImages[item.category] || 'menu-shawarma.jpg';
      var panel = document.getElementById('itemDetailPanel');
      panel.innerHTML =
        '<img class="item-detail-photo" src="' + img + '" alt="">' +
        '<div class="item-detail-caption">' + escHtml(label) + '</div>';
    }

    function findLine(itemId){ return cart.find(function(c){ return c.menu_item_id === itemId; }); }

    function addOne(itemId){
      var item = itemsById[itemId];
      if (!item) return;
      var line = findLine(itemId);
      if (line) {
        line.quantity += 1;
      } else {
        var label = item.name + (item.variant_name ? ' \u2014 ' + item.variant_name : '');
        cart.push({ menu_item_id: itemId, name: label, unitPrice: Number(item.price), quantity: 1 });
      }
      renderCartBar();
      syncQtyDisplays();
    }

    function removeOne(itemId){
      var line = findLine(itemId);
      if (!line) return;
      line.quantity -= 1;
      if (line.quantity <= 0) cart = cart.filter(function(c){ return c.menu_item_id !== itemId; });
      renderCartBar();
      syncQtyDisplays();
    }

    function syncQtyDisplays(){
      document.querySelectorAll('.option-qty-value').forEach(function(el){
        var line = findLine(el.getAttribute('data-id'));
        el.textContent = line ? line.quantity : 0;
      });
    }

    function cartTotal(){ return cart.reduce(function(sum, c){ return sum + c.unitPrice * c.quantity; }, 0); }
    function cartCount(){ return cart.reduce(function(sum, c){ return sum + c.quantity; }, 0); }

    function renderCartBar(){
      var bar = document.getElementById('cartBar');
      var count = cartCount();
      if (count === 0) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      document.getElementById('cartBarInfo').textContent = count + ' item' + (count === 1 ? '' : 's') + ' \u00b7 $' + cartTotal().toFixed(2);
    }

    // ---- Screen navigation ----
    function goToOrderScreen(){
      idleScreen.classList.add('hidden');
      checkoutScreen.classList.add('hidden');
      orderScreen.classList.remove('hidden');
      resetInactivityTimer();
    }
    function goToCheckoutScreen(){
      if (!cart.length) return;
      orderScreen.classList.add('hidden');
      checkoutScreen.classList.remove('hidden');
      document.getElementById('checkoutItemsList').innerHTML = cart.map(function(c){
        return '<div class="checkout-item-row"><span class="nm">' + escHtml(c.name) + ' &times; ' + c.quantity + '</span>' +
          '<span class="amt">$' + (c.unitPrice * c.quantity).toFixed(2) + '</span></div>';
      }).join('');
      document.getElementById('checkoutTotalDisplay').textContent = '$' + cartTotal().toFixed(2);
      resetInactivityTimer();
    }

    document.getElementById('startOrderBtn').addEventListener('click', goToOrderScreen);
    document.getElementById('startOverBtn').addEventListener('click', function(){ window.location.reload(); });
    document.getElementById('cartBarBtn').addEventListener('click', goToCheckoutScreen);
    document.getElementById('kioskBackBtn').addEventListener('click', function(){
      checkoutScreen.classList.add('hidden');
      orderScreen.classList.remove('hidden');
    });

    var emailSkipped = false;
    document.getElementById('skipEmailBtn').addEventListener('click', function(){
      var emailInput = document.getElementById('kioskEmail');
      emailSkipped = !emailSkipped;
      if (emailSkipped) {
        emailInput.value = '';
        emailInput.disabled = true;
        this.textContent = 'Email skipped \u2014 tap to add one instead';
      } else {
        emailInput.disabled = false;
        this.textContent = "Skip \u2014 I'll just get my order number";
      }
    });

    // ---- Checkout / payment ----
    var KIOSK_EDGE_FUNCTION_URL = 'https://njcmcaoyzujijiyfardx.supabase.co/functions/v1/create-order-checkout';
    var KIOSK_ANON_KEY = 'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_';

    document.getElementById('kioskPayBtn').addEventListener('click', function(){
      var payBtn = this;
      var msgEl = document.getElementById('kioskCheckoutMsg');
      var name = document.getElementById('kioskName').value.trim();
      var email = document.getElementById('kioskEmail').value.trim();

      msgEl.textContent = '';

      if (!cart.length) {
        msgEl.textContent = 'Your cart is empty.';
        return;
      }

      payBtn.disabled = true;
      payBtn.textContent = 'Preparing checkout\u2026';

      var itemsPayload = cart.map(function(c){
        return { menu_item_id: c.menu_item_id, quantity: c.quantity, name: c.name };
      });

      fetch(KIOSK_EDGE_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KIOSK_ANON_KEY },
        body: JSON.stringify({
          items: itemsPayload,
          customerName: name || 'Kiosk Guest',
          customerEmail: email || undefined,
          orderSource: 'kiosk'
        })
      }).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
        .then(function(result){
          if (!result.ok || !result.data.url) {
            payBtn.disabled = false;
            payBtn.textContent = 'Pay Now';
            msgEl.textContent = (result.data && result.data.error) ? String(result.data.error) : "Couldn't start checkout \u2014 please ask for help.";
            return;
          }
          window.location.href = result.data.url;
        })
        .catch(function(){
          payBtn.disabled = false;
          payBtn.textContent = 'Pay Now';
          msgEl.textContent = "Couldn't reach checkout \u2014 please ask for help.";
        });
    });

    loadMenu();
  })();
</script>

</body>
</html>
