<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Here — Roll-In Shawarma</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --black:#000000; --panel:#121110; --white:#FFFCF3; --cream:#F3EAC9;
    --muted:rgba(243,234,201,0.62); --gold:#F7AD28; --red:#D8342E; --green:#0BAF4C;
    --line:rgba(243,234,201,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html, body{ background:var(--black); }
  body{
    color:var(--cream); font-family:'Inter', -apple-system, sans-serif;
    line-height:1.4; min-height:100vh; padding-bottom:100px;
  }
  .hidden{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  input, textarea{ font-family:inherit; }

  /* ---------- header ---------- */
  .app-header{ padding:24px 20px 8px; background:var(--black); }
  .app-header h1{ font-size:26px; font-weight:800; color:var(--white); letter-spacing:-0.01em; }
  .app-header p{ font-size:13px; color:var(--muted); margin-top:4px; }

  .wrap{ max-width:560px; margin:0 auto; padding:8px 20px; background:var(--black); }

  /* ---------- category accordion: collapsed list, one at a time expands ---------- */
  .category-block{ border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--panel); }
  .category-row{
    display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
    background:var(--panel); color:var(--white); font-size:17px; font-weight:800; padding:18px 20px;
  }
  .category-row .chev{ color:var(--muted); transition:transform .2s ease; font-size:13px; }
  .category-block.expanded .category-row .chev{ transform:rotate(180deg); }

  .category-expanded{ max-height:0; overflow:hidden; transition:max-height .3s ease; background:var(--black); }
  .category-block.expanded .category-expanded{ max-height:3000px; }

  /* photo only rendered/shown once the category is actually expanded */
  .category-photo{
    width:100%; max-height:200px; object-fit:contain; display:block;
    background:var(--black); padding:10px 0;
  }

  .item-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 20px; border-top:1px solid var(--line); background:var(--black);
  }
  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size:15px; font-weight:700; color:var(--cream); }
  .item-desc{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .item-price{ font-size:13.5px; font-weight:700; color:var(--gold); margin-top:4px; }
  .item-add-control{ flex:none; }
  .quick-add-btn{
    width:34px; height:34px; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--gold);
    font-size:19px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .quick-add-btn:active{ background:var(--gold); color:#241902; border-color:var(--gold); }
  .item-qty-stepper{ display:flex; align-items:center; gap:9px; }
  .item-qty-btn{ width:28px; height:28px; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--cream); font-size:16px; display:flex; align-items:center; justify-content:center; }
  .item-qty-btn:active{ background:var(--gold); color:#241902; }
  .item-qty-value{ min-width:16px; text-align:center; font-size:14px; font-weight:800; color:var(--white); }

  /* ---------- persistent cart bar ---------- */
  #cartBar{
    position:fixed; left:0; right:0; bottom:0; background:var(--gold); color:#241902;
    display:flex; align-items:center; justify-content:space-between; padding:14px 20px;
    box-shadow:0 -8px 30px rgba(0,0,0,0.4); z-index:70; gap:12px;
  }
  #cartBar.hidden{ display:none !important; }
  #cartBarInfo{ font-size:14.5px; font-weight:800; flex:1; }
  #cartBarClearBtn{ background:none; color:#241902; opacity:0.7; font-size:13px; font-weight:700; text-decoration:underline; }
  #cartBarBtn{ background:#241902; color:var(--gold); font-size:14.5px; font-weight:800; padding:12px 22px; border-radius:100px; }

  /* ---------- checkout screen ---------- */
  #checkoutScreen{ position:fixed; inset:0; background:var(--black); z-index:80; overflow-y:auto; }
  .checkout-body{ padding:20px; max-width:560px; margin:0 auto; padding-bottom:140px; }
  .checkout-body h2{ font-size:24px; font-weight:800; color:var(--white); margin-bottom:18px; }
  .checkout-items-list{ border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:20px; }
  .checkout-item-row{ display:flex; justify-content:space-between; padding:7px 0; font-size:14.5px; }
  .checkout-item-row .nm{ color:var(--white); }
  .checkout-item-row .amt{ color:var(--muted); }
  .checkout-breakdown-row{ display:flex; justify-content:space-between; padding:6px 0; font-size:14px; color:var(--muted); }
  .checkout-total-row{ display:flex; justify-content:space-between; font-size:19px; font-weight:800; color:var(--white); padding-top:12px; margin-top:8px; border-top:1px solid var(--line); }
  .checkout-total-row span{ color:var(--gold); }

  .kiosk-field{ margin-bottom:18px; }
  .kiosk-field label{ display:block; font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; }
  .kiosk-field input, .kiosk-field textarea{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 14px; color:var(--white); font-size:16px;
  }
  .kiosk-field input:focus, .kiosk-field textarea:focus{ outline:none; border-color:var(--gold); }

  .payment-choice{ display:flex; gap:10px; margin-bottom:20px; }
  .payment-choice-btn{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px; color:var(--cream); font-size:15px; font-weight:700; text-align:center;
  }
  .payment-choice-btn.selected{ background:var(--gold); border-color:var(--gold); color:#241902; }

  .checkout-footer{ position:fixed; left:0; right:0; bottom:0; background:var(--black); padding:16px 20px; border-top:1px solid var(--line); max-width:560px; margin:0 auto; }
  #payBtn{ width:100%; background:var(--gold); color:#241902; font-size:18px; font-weight:800; padding:18px; border-radius:14px; }
  #payBtn:disabled{ opacity:0.6; }
  #backToMenuBtn{ display:block; margin:14px auto 0; background:none; color:var(--muted); font-size:14px; }
  #checkoutMsg{ text-align:center; font-size:13.5px; color:var(--red); min-height:18px; margin-top:10px; }

  .empty-hint{ color:var(--muted); font-size:14px; text-align:center; padding:30px 20px; }
</style>
</head>
<body>

<div class="app-header">
  <h1>Roll-In Shawarma</h1>
  <p>Give us a few minutes to roll &mdash; worth the wait.</p>
</div>

<div class="wrap">
  <div id="categoryList"></div>
</div>

<div id="cartBar" class="hidden">
  <div id="cartBarInfo">0 items &middot; $0.00</div>
  <button type="button" id="cartBarClearBtn">Clear</button>
  <button type="button" id="cartBarBtn">Checkout &rarr;</button>
</div>

<div id="checkoutScreen" class="hidden">
  <div class="checkout-body">
    <h2>Almost there!</h2>
    <div class="checkout-items-list" id="checkoutItemsList"></div>

    <div class="checkout-breakdown-row">Subtotal <span id="ckSubtotal">$0.00</span></div>
    <div class="checkout-total-row">Total <span id="ckTotal">$0.00</span></div>

    <div class="kiosk-field" style="margin-top:24px;">
      <label>Name (so we can call you)</label>
      <input type="text" id="custName" placeholder="Your first name">
    </div>
    <div class="kiosk-field">
      <label>Email (for your receipt)</label>
      <input type="email" id="custEmail" placeholder="you@example.com">
    </div>
    <div class="kiosk-field">
      <label>Phone (optional)</label>
      <input type="tel" id="custPhone">
    </div>

    <div class="kiosk-field">
      <label>How will you pay?</label>
      <div class="payment-choice">
        <button type="button" class="payment-choice-btn selected" id="cardChoiceBtn">Card</button>
        <button type="button" class="payment-choice-btn" id="cashChoiceBtn">Cash at Counter</button>
      </div>
    </div>

    <div class="kiosk-field">
      <label>Notes (optional)</label>
      <textarea id="custNotes" rows="2" placeholder="Any special requests..."></textarea>
    </div>
  </div>

  <div class="checkout-footer">
    <button type="button" id="payBtn">Pay Now</button>
    <div id="checkoutMsg"></div>
    <button type="button" id="backToMenuBtn">&larr; Back to menu</button>
  </div>
</div>

<script>
  var sbShared = supabase.createClient(
    'https://njcmcaoyzujijiyfardx.supabase.co',
    'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_'
  );

  (function(){
    var cart = [];
    var itemsById = {};
    var categoryOrder = [];
    var expandedCategory = null;
    var paymentMethod = 'card';

    var TAX_RATE = 0.0675;
    // No online processing fee for orders through this page at all --
    // neither card nor cash. The backend (create-order-checkout.ts)
    // already skips this fee for orderSource:'qr', so this preview
    // just needs to match what will actually be charged.

    var categoryImages = {
      'Shawarma': 'menu-shawarma.jpg', 'Frankie Rolls': 'menu-frankie.jpg',
      'Bowls': 'menu-bowl.jpg', 'Tacos': 'menu-tacos.jpg',
      'Loaded Fries': 'menu-fries.jpg', 'Sides': 'menu-samosas.jpg',
      'Kulfi Ice Cream': 'menu-kulfi.jpg', 'Drinks': 'menu-falooda.jpg'
    };

    function escHtml(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    function loadMenu(){
      sbShared.from('menu_items').select('*').order('display_order').then(function(res){
        if (res.error || !res.data) return;
        var byCategory = {};
        res.data.forEach(function(item){
          itemsById[item.id] = item;
          if (item.category === 'Catering') return;
          if (!byCategory[item.category]) {
            byCategory[item.category] = [];
            categoryOrder.push(item.category);
          }
          byCategory[item.category].push(item);
        });
        window.__orderByCategory = byCategory;
        renderCategoryList();
      });
    }

    // Categories render collapsed by default -- name only, no photo,
    // no items. A photo only ever appears once a category is
    // actually expanded, and collapses away again when it's closed.
    function renderCategoryList(){
      var listEl = document.getElementById('categoryList');
      if (!categoryOrder.length) {
        listEl.innerHTML = '<div class="empty-hint">Menu is loading, one moment&hellip;</div>';
        return;
      }

      listEl.innerHTML = categoryOrder.map(function(cat){
        return '<div class="category-block" data-cat="' + escHtml(cat) + '">' +
          '<button type="button" class="category-row" data-cat="' + escHtml(cat) + '">' +
            escHtml(cat) + '<span class="chev">\u25BC</span>' +
          '</button>' +
          '<div class="category-expanded" data-cat="' + escHtml(cat) + '"></div>' +
        '</div>';
      }).join('');

      listEl.querySelectorAll('.category-row').forEach(function(btn){
        btn.addEventListener('click', function(){ toggleCategory(btn.getAttribute('data-cat')); });
      });
    }

    // Only one category open at a time -- opening a new one collapses
    // whatever was previously open, back to the plain category list.
    function toggleCategory(cat){
      var wasExpanded = expandedCategory === cat;

      document.querySelectorAll('.category-block').forEach(function(block){
        block.classList.remove('expanded');
      });

      if (wasExpanded) {
        expandedCategory = null;
        return;
      }

      expandedCategory = cat;
      var block = document.querySelector('.category-block[data-cat="' + cssEscape(cat) + '"]');
      if (block) block.classList.add('expanded');

      renderCategoryContent(cat);
    }

    function cssEscape(s){ return String(s).replace(/"/g, '\\"'); }

    function renderCategoryContent(cat){
      var contentEl = document.querySelector('.category-expanded[data-cat="' + cssEscape(cat) + '"]');
      if (!contentEl) return;
      var items = (window.__orderByCategory[cat] || []);
      var img = categoryImages[cat] || 'menu-shawarma.jpg';

      var rowsHtml = items.map(function(item){
        var label = item.name + (item.variant_name ? ' \u2014 ' + item.variant_name : '');
        return '<div class="item-row">' +
          '<div class="item-info">' +
            '<div class="item-name">' + escHtml(label) + '</div>' +
            (item.description ? '<div class="item-desc">' + escHtml(item.description) + '</div>' : '') +
            '<div class="item-price">$' + Number(item.price).toFixed(2) + '</div>' +
          '</div>' +
          '<div class="item-add-control" data-id="' + item.id + '"></div>' +
        '</div>';
      }).join('');

      contentEl.innerHTML = '<img class="category-photo" src="' + img + '" alt="' + escHtml(cat) + '">' + rowsHtml;

      items.forEach(function(item){ renderItemControl(item.id); });
    }

    function renderItemControl(itemId){
      var controlEl = document.querySelector('.item-add-control[data-id="' + itemId + '"]');
      if (!controlEl) return;
      var line = findLine(itemId);

      if (!line) {
        controlEl.innerHTML = '<button type="button" class="quick-add-btn" data-id="' + itemId + '">+</button>';
        controlEl.querySelector('.quick-add-btn').addEventListener('click', function(){ addOne(itemId); });
      } else {
        controlEl.innerHTML =
          '<div class="item-qty-stepper">' +
            '<button type="button" class="item-qty-btn" data-id="' + itemId + '" data-dir="-1">\u2212</button>' +
            '<span class="item-qty-value">' + line.quantity + '</span>' +
            '<button type="button" class="item-qty-btn" data-id="' + itemId + '" data-dir="1">+</button>' +
          '</div>';
        controlEl.querySelectorAll('.item-qty-btn').forEach(function(btn){
          btn.addEventListener('click', function(){
            if (btn.getAttribute('data-dir') === '1') addOne(itemId); else removeOne(itemId);
          });
        });
      }
    }

    function findLine(itemId){ return cart.find(function(c){ return c.menu_item_id === itemId; }); }

    function addOne(itemId){
      var item = itemsById[itemId];
      if (!item) return;
      var line = findLine(itemId);
      if (line) {
        line.quantity += 1;
      } else {
        var label = item.name + (item.variant_name ? ' \u2014 ' + item.variant_name : '');
        cart.push({ menu_item_id: itemId, name: label, unitPrice: Number(item.price), quantity: 1 });
      }
      renderCartBar();
      renderItemControl(itemId);
    }

    function removeOne(itemId){
      var item = itemsById[itemId];
      var line = findLine(itemId);
      if (!line) return;
      var minQty = item && item.min_quantity;
      if (minQty && line.quantity <= minQty) {
        cart = cart.filter(function(c){ return c.menu_item_id !== itemId; });
      } else {
        line.quantity -= 1;
        if (line.quantity <= 0) cart = cart.filter(function(c){ return c.menu_item_id !== itemId; });
      }
      renderCartBar();
      renderItemControl(itemId);
    }

    function cartTotal(){ return cart.reduce(function(s,c){ return s + c.unitPrice*c.quantity; }, 0); }
    function cartCount(){ return cart.reduce(function(s,c){ return s + c.quantity; }, 0); }

    function renderCartBar(){
      var bar = document.getElementById('cartBar');
      var count = cartCount();
      if (count === 0) { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      document.getElementById('cartBarInfo').textContent = count + ' item' + (count === 1 ? '' : 's') + ' \u00b7 $' + cartTotal().toFixed(2);
    }

    document.getElementById('cartBarClearBtn').addEventListener('click', function(){
      if (!cart.length) return;
      if (!confirm('Clear your whole cart?')) return;
      cart = [];
      renderCartBar();
      // refresh whichever category is currently expanded, if any, so its qty controls reset to 0
      if (expandedCategory) renderCategoryContent(expandedCategory);
    });

    // Card and cash both cost exactly subtotal + tax -- no processing
    // fee either way for orders placed through this page.
    function computeTotals(){
      var subtotalCents = Math.round(cartTotal() * 100);
      var taxCents = Math.round(subtotalCents * TAX_RATE);
      var totalCents = subtotalCents + taxCents;
      return {
        subtotal: subtotalCents / 100,
        tax: taxCents / 100,
        total: totalCents / 100,
      };
    }

    function refreshCheckoutBreakdown(){
      var totals = computeTotals();
      document.getElementById('ckSubtotal').textContent = '$' + totals.subtotal.toFixed(2) + ' + $' + totals.tax.toFixed(2) + ' tax';
      document.getElementById('ckTotal').textContent = '$' + totals.total.toFixed(2);
    }

    var checkoutScreen = document.getElementById('checkoutScreen');

    function showCheckout(){
      if (!cart.length) return;
      checkoutScreen.classList.remove('hidden');
      document.getElementById('checkoutItemsList').innerHTML = cart.map(function(c){
        return '<div class="checkout-item-row"><span class="nm">' + escHtml(c.name) + ' \u00d7 ' + c.quantity + '</span>' +
          '<span class="amt">$' + (c.unitPrice * c.quantity).toFixed(2) + '</span></div>';
      }).join('');
      refreshCheckoutBreakdown();
    }

    document.getElementById('cartBarBtn').addEventListener('click', showCheckout);
    document.getElementById('backToMenuBtn').addEventListener('click', function(){
      checkoutScreen.classList.add('hidden');
    });

    document.getElementById('cardChoiceBtn').addEventListener('click', function(){
      paymentMethod = 'card';
      this.classList.add('selected');
      document.getElementById('cashChoiceBtn').classList.remove('selected');
    });
    document.getElementById('cashChoiceBtn').addEventListener('click', function(){
      paymentMethod = 'cash';
      this.classList.add('selected');
      document.getElementById('cardChoiceBtn').classList.remove('selected');
    });

    var CARD_CHECKOUT_URL = 'https://njcmcaoyzujijiyfardx.supabase.co/functions/v1/create-order-checkout';
    var CASH_ORDER_URL = 'https://njcmcaoyzujijiyfardx.supabase.co/functions/v1/create-cash-order';
    var ANON_KEY = 'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_';

    document.getElementById('payBtn').addEventListener('click', function(){
      var payBtn = this;
      var msgEl = document.getElementById('checkoutMsg');
      var name = document.getElementById('custName').value.trim();
      var email = document.getElementById('custEmail').value.trim();
      var phone = document.getElementById('custPhone').value.trim();
      var notes = document.getElementById('custNotes').value.trim();

      msgEl.textContent = '';

      if (!cart.length) { msgEl.textContent = 'Your cart is empty.'; return; }

      payBtn.disabled = true;
      payBtn.textContent = 'Preparing checkout\u2026';

      var itemsPayload = cart.map(function(c){
        return { menu_item_id: c.menu_item_id, quantity: c.quantity, name: c.name };
      });

      var url = paymentMethod === 'cash' ? CASH_ORDER_URL : CARD_CHECKOUT_URL;
      var body = paymentMethod === 'cash'
        ? { items: itemsPayload, customerName: name || 'QR Order', customerEmail: email || undefined, customerPhone: phone || undefined, notes: notes || undefined }
        : { items: itemsPayload, customerName: name || 'QR Order', customerEmail: email || undefined, customerPhone: phone || undefined, notes: notes || undefined, orderSource: 'qr' };

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ANON_KEY },
        body: JSON.stringify(body)
      }).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
        .then(function(result){
          if (!result.ok) {
            payBtn.disabled = false;
            payBtn.textContent = 'Pay Now';
            msgEl.textContent = (result.data && result.data.error) ? String(result.data.error) : "Couldn't start checkout \u2014 please try again.";
            return;
          }
          if (paymentMethod === 'cash') {
            window.location.href = 'kiosk-thank-you.html?ref=' + encodeURIComponent(result.data.referenceCode) + '&cash=true';
            return;
          }
          window.location.href = result.data.url;
        })
        .catch(function(){
          payBtn.disabled = false;
          payBtn.textContent = 'Pay Now';
          msgEl.textContent = "Couldn't reach checkout \u2014 please try again.";
        });
    });

    loadMenu();
  })();
</script>

</body>
</html>
