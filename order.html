<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Order Here — Roll-In Shawarma</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --black:#000000; --panel:#16130F; --panel-2:#211C16; --line:rgba(243,234,201,0.13);
    --cream:#F3EAC9; --white:#FFFCF3; --muted:rgba(243,234,201,0.64);
    --gold:#F7AD28; --gold-ink:#241902; --red:#D8342E; --green:#0BAF4C;
    --display:'Barlow Condensed', 'Arial Narrow', 'Inter', sans-serif;
    --body:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --rail-h:64px;
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{ background:var(--black); color:var(--cream); font-family:var(--body); font-size:15px; line-height:1.45; min-height:100vh; }
  body.locked{ overflow:hidden; }
  button, input, select, textarea{ font:inherit; color:inherit; }
  button{ background:none; border:none; cursor:pointer; }
  button:disabled{ cursor:not-allowed; }
  img{ display:block; max-width:100%; }
  .hidden{ display:none !important; }
  :focus-visible{ outline:3px solid var(--gold); outline-offset:2px; border-radius:6px; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- Header ---------- */
  .top{ display:flex; align-items:center; gap:14px; padding:18px 16px 14px; max-width:1040px; margin:0 auto; }
  .top-logo{ width:52px; height:52px; border-radius:50%; object-fit:cover; flex:none; border:2px solid var(--panel-2); }
  .top h1{ font-family:var(--display); font-weight:800; font-size:30px; line-height:1; letter-spacing:0.01em; }
  .top h1 .w1{ color:var(--gold); } .top h1 .w2{ color:var(--red); }
  .top-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-top:6px; font-size:13px; color:var(--muted); }
  .halal-pill{ display:inline-flex; align-items:center; gap:5px; color:var(--cream); font-weight:600; }
  .halal-pill svg{ width:15px; height:15px; color:var(--green); }
  .pulse{ display:inline-flex; align-items:center; gap:6px; }
  .pulse-dot{ width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(11,175,76,0.6); animation:pulse 2s infinite; }
  .pulse.busy .pulse-dot{ background:var(--gold); box-shadow:0 0 0 0 rgba(247,173,40,0.6); }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(11,175,76,0.5); } 70%{ box-shadow:0 0 0 7px rgba(11,175,76,0); } 100%{ box-shadow:0 0 0 0 rgba(11,175,76,0); } }

  .track-banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1040px; margin:0 auto 10px; padding:10px 14px; margin-left:16px; margin-right:16px; background:rgba(11,175,76,0.12); border:1px solid rgba(11,175,76,0.5); border-radius:14px; font-size:14px; }
  @media (min-width:1072px){ .track-banner{ margin-left:auto; margin-right:auto; } }
  .track-banner a{ flex:none; background:var(--green); color:#03220f; font-weight:800; text-decoration:none; padding:8px 14px; border-radius:100px; }

  /* ---------- Sticky photo-chip rail (the one bold element) ---------- */
  .cat-rail{ position:sticky; top:0; z-index:40; background:rgba(0,0,0,0.92); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .cat-rail-inner{ display:flex; gap:8px; overflow-x:auto; padding:10px 16px; max-width:1040px; margin:0 auto; scrollbar-width:none; scroll-behavior:smooth; }
  .cat-rail-inner::-webkit-scrollbar{ display:none; }
  .chip{ flex:none; display:flex; align-items:center; gap:8px; padding:4px 14px 4px 4px; border-radius:100px; background:var(--panel); border:1px solid var(--line); color:var(--cream); font-weight:600; font-size:14px; white-space:nowrap; min-height:44px; transition:background .15s ease, border-color .15s ease, color .15s ease; }
  .chip img{ width:34px; height:34px; border-radius:50%; object-fit:cover; background:var(--panel-2); }
  .chip[aria-current="true"]{ background:var(--gold); border-color:var(--gold); color:var(--gold-ink); }

  /* ---------- Menu ---------- */
  .menu{ max-width:1040px; margin:0 auto; padding:6px 16px 130px; }
  .menu-state{ padding:40px 0; text-align:center; color:var(--muted); }
  .menu-state button{ margin-top:14px; background:var(--gold); color:var(--gold-ink); font-weight:800; padding:12px 22px; border-radius:100px; }
  .section{ padding-top:22px; scroll-margin-top:calc(var(--rail-h) + 6px); }
  .section-title{ font-family:var(--display); font-weight:800; font-size:30px; line-height:1.05; color:var(--white); }
  .section-desc{ color:var(--muted); font-size:14px; margin-top:4px; max-width:60ch; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; margin-top:14px; }
  @media (min-width:620px){ .grid{ grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:16px; } }

  /* Kiosk-model tile: uncropped square photo, name, price, action */
  .tile{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .tile-open{ display:flex; flex-direction:column; text-align:left; width:100%; flex:1; }
  .tile-photo{ position:relative; aspect-ratio:1; background:var(--panel-2); display:block; overflow:hidden; min-height:0; }
  .tile-photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .tile-photo img.is-fallback{ object-fit:cover; opacity:0.85; }
  .tile-body{ display:flex; flex-direction:column; gap:2px; padding:10px 12px 14px; padding-right:12px; flex:1; }
  .tile-name{ font-weight:700; font-size:15px; line-height:1.25; color:var(--white); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tile-sub{ font-size:12.5px; color:var(--muted); }
  .tile-price{ font-family:var(--display); font-weight:700; font-size:20px; color:var(--gold); margin-top:auto; padding-top:4px; }
  .tile-actions-anchor{ position:absolute; left:0; right:0; top:0; aspect-ratio:1; pointer-events:none; }
  .tile-actions-anchor > *{ pointer-events:auto; }
  .add-btn{ position:absolute; right:8px; bottom:8px; width:44px; height:44px; border-radius:50%; background:var(--gold); color:var(--gold-ink); font-size:26px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,0.45); }
  .add-btn .add-count{ font-family:var(--display); font-size:21px; font-weight:800; }
  .add-btn:active{ transform:scale(0.94); }
  .stepper{ position:absolute; right:8px; bottom:8px; display:flex; align-items:center; background:var(--gold); color:var(--gold-ink); border-radius:100px; box-shadow:0 4px 14px rgba(0,0,0,0.45); }
  .stepper button{ width:40px; height:44px; font-size:22px; font-weight:700; color:var(--gold-ink); }
  .stepper span{ min-width:22px; text-align:center; font-family:var(--display); font-weight:800; font-size:20px; }
  .tile.is-soldout .tile-photo img{ filter:grayscale(1); opacity:0.35; }
  .tile.is-soldout .tile-price{ color:var(--muted); }
  .soldout-tag{ position:absolute; left:8px; bottom:8px; background:var(--black); color:var(--cream); border:1px solid var(--line); font-size:12px; font-weight:700; padding:5px 10px; border-radius:100px; }

  .menu-foot{ margin-top:34px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }

  /* ---------- Sticky order bar ---------- */
  .order-bar{ position:fixed; left:0; right:0; bottom:0; z-index:50; padding:10px 16px calc(10px + var(--safe-b)); background:linear-gradient(to top, rgba(0,0,0,0.96) 70%, rgba(0,0,0,0)); }
  .order-bar button{ display:flex; align-items:center; gap:12px; width:100%; max-width:560px; margin:0 auto; background:var(--gold); color:var(--gold-ink); border-radius:100px; padding:10px 20px 10px 10px; min-height:56px; font-weight:800; font-size:16px; box-shadow:0 8px 26px rgba(0,0,0,0.5); }
  .ob-count{ background:var(--gold-ink); color:var(--gold); border-radius:100px; min-width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:19px; padding:0 8px; }
  .ob-total{ margin-left:auto; font-family:var(--display); font-size:22px; }
  .order-bar.bump button{ animation:bump .35s ease; }
  @keyframes bump{ 0%{ transform:scale(1); } 40%{ transform:scale(1.04); } 100%{ transform:scale(1); } }

  /* ---------- Sheets (item detail + cart) ---------- */
  .scrim{ position:fixed; inset:0; z-index:60; background:rgba(0,0,0,0.66); }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:70; max-height:92vh; display:flex; flex-direction:column; background:var(--panel); border-radius:22px 22px 0 0; border-top:1px solid var(--line); max-width:640px; margin:0 auto; }
  @media (min-width:700px){ .sheet{ bottom:auto; top:50%; transform:translateY(-50%); border-radius:22px; border:1px solid var(--line); max-height:88vh; } }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px 6px; flex:none; }
  .sheet-head h2{ font-family:var(--display); font-weight:800; font-size:28px; color:var(--white); }
  .sheet-close{ width:44px; height:44px; border-radius:50%; background:var(--panel-2); color:var(--cream); font-size:24px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none; }
  .sheet-scroll{ overflow-y:auto; padding:0 16px 16px; -webkit-overflow-scrolling:touch; flex:1; }
  .sheet-foot{ flex:none; padding:12px 16px calc(14px + var(--safe-b)); border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; background:var(--panel); border-radius:0 0 22px 22px; }
  .sheet-photo{ background:var(--panel-2); border-radius:16px; overflow:hidden; }
  .sheet-photo img{ width:100%; max-height:34vh; object-fit:contain; margin:0 auto; }
  .sheet-photo img.is-fallback{ object-fit:cover; }
  .item-title{ font-family:var(--display); font-weight:800; font-size:30px; line-height:1.05; color:var(--white); margin-top:14px; }
  .item-price{ font-family:var(--display); font-weight:700; font-size:22px; color:var(--gold); margin-top:2px; }
  .item-desc{ color:var(--muted); margin-top:6px; max-width:60ch; }
  .opt-group{ margin-top:18px; border:none; }
  .opt-group legend{ font-weight:700; color:var(--white); font-size:15px; margin-bottom:8px; }
  .opt-group legend small{ font-weight:500; color:var(--muted); margin-left:6px; font-size:13px; }
  .opt{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; cursor:pointer; min-height:52px; background:var(--black); }
  .opt input{ accent-color:var(--gold); width:20px; height:20px; flex:none; }
  .opt-name{ flex:1; font-weight:600; }
  .opt-price{ color:var(--muted); font-size:14px; }
  .opt:has(input:checked){ border-color:var(--gold); background:rgba(247,173,40,0.08); }
  .opt.is-disabled{ opacity:0.45; cursor:not-allowed; }
  .combo{ margin-top:18px; border:1px dashed rgba(247,173,40,0.55); border-radius:14px; padding:14px; background:rgba(247,173,40,0.05); }
  .combo-toggle{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .combo-toggle input{ accent-color:var(--gold); width:22px; height:22px; flex:none; }
  .combo-toggle strong{ color:var(--white); font-size:16px; display:block; }
  .combo-toggle span.combo-sub{ color:var(--muted); font-size:13.5px; }
  .combo-drinks{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .drink-chip{ padding:10px 14px; border-radius:100px; border:1px solid var(--line); background:var(--black); font-weight:600; font-size:14px; min-height:44px; }
  .drink-chip[aria-pressed="true"]{ background:var(--gold); color:var(--gold-ink); border-color:var(--gold); }
  .qty{ display:flex; align-items:center; background:var(--black); border:1px solid var(--line); border-radius:100px; flex:none; }
  .qty button{ width:44px; height:48px; font-size:22px; font-weight:700; }
  .qty span{ min-width:26px; text-align:center; font-family:var(--display); font-weight:800; font-size:21px; }
  .cta{ flex:1; background:var(--gold); color:var(--gold-ink); font-weight:800; font-size:16px; border-radius:100px; min-height:52px; padding:0 18px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .cta .cta-amt{ font-family:var(--display); font-size:21px; }
  .cta:disabled{ background:var(--panel-2); color:var(--muted); }
  .sheet-hint{ color:var(--red); font-size:13.5px; font-weight:600; margin-top:10px; min-height:1em; }

  /* Cart */
  .cart-clear{ color:var(--muted); font-size:14px; text-decoration:underline; padding:10px 4px; }
  .line{ display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .line-photo{ width:54px; height:54px; border-radius:12px; background:var(--panel-2); overflow:hidden; flex:none; }
  .line-photo img{ width:100%; height:100%; object-fit:contain; }
  .line-photo img.is-fallback{ object-fit:cover; }
  .line-info{ flex:1; min-width:0; }
  .line-name{ font-weight:600; color:var(--white); }
  .line-each{ color:var(--muted); font-size:13px; }
  .line-var{ color:#FF8C1A; font-size:13.5px; font-weight:600; }
  .qty:has(> button:only-of-type){ padding-right:10px; }
  .line-amt{ font-family:var(--display); font-weight:700; font-size:19px; color:var(--cream); min-width:60px; text-align:right; }
  .line .qty button{ width:38px; height:40px; font-size:19px; }
  .line .qty span{ min-width:20px; font-size:18px; }
  .upsell{ margin-top:20px; }
  .upsell h3{ font-weight:700; color:var(--white); font-size:16px; }
  .upsell-row{ display:flex; gap:10px; overflow-x:auto; padding:10px 0 4px; scrollbar-width:none; }
  .upsell-row::-webkit-scrollbar{ display:none; }
  .mini{ flex:none; width:128px; background:var(--black); border:1px solid var(--line); border-radius:14px; overflow:hidden; position:relative; }
  .mini .tile-photo{ aspect-ratio:1; }
  .mini-name{ font-size:13px; font-weight:600; padding:8px 10px 0; line-height:1.25; min-height:2.5em; color:var(--white); }
  .mini-price{ font-family:var(--display); font-weight:700; font-size:17px; color:var(--gold); padding:0 10px 10px; }
  .mini .add-btn{ width:38px; height:38px; font-size:22px; right:6px; bottom:6px; }
  .totals{ margin-top:18px; }
  .totals div{ display:flex; justify-content:space-between; padding:3px 0; color:var(--muted); }
  .totals .grand{ color:var(--white); font-weight:700; font-size:17px; padding-top:8px; }
  .totals .grand span:last-child{ font-family:var(--display); font-size:24px; color:var(--gold); }

  /* ---------- Checkout (one page) ---------- */
  .checkout{ position:fixed; inset:0; z-index:80; background:var(--black); overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .co-head{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--black); border-bottom:1px solid var(--line); }
  .co-head h2{ font-family:var(--display); font-weight:800; font-size:28px; color:var(--white); }
  .co-body{ max-width:620px; margin:0 auto; padding:8px 16px 150px; }
  .co-sec{ padding:20px 0; border-bottom:1px solid var(--line); }
  .co-sec h3{ font-family:var(--display); font-weight:800; font-size:23px; color:var(--white); margin-bottom:12px; }
  .seg{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .seg button, .pay-opt{ text-align:left; padding:14px; border-radius:14px; border:1px solid var(--line); background:var(--panel); min-height:64px; }
  .seg button strong, .pay-opt strong{ display:block; color:var(--white); font-size:15.5px; }
  .seg button span, .pay-opt span{ display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .seg button[aria-pressed="true"], .pay-opt[aria-pressed="true"]{ border-color:var(--gold); background:rgba(247,173,40,0.09); box-shadow:inset 0 0 0 1px var(--gold); }
  .pay-opts{ display:grid; gap:10px; }
  .pay-opt:disabled{ opacity:0.45; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-weight:600; color:var(--white); margin-bottom:6px; font-size:14.5px; }
  .field label small{ color:var(--muted); font-weight:500; }
  .field input, .field select, .field textarea{ width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 14px; font-size:16px; color:var(--white); }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(247,173,40,0.25); }
  .field .hint{ color:var(--muted); font-size:13px; margin-top:5px; }
  .field.invalid input, .field.invalid select{ border-color:var(--red); }
  .swatches{ display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:8px; }
  .swatch-btn{ display:flex; align-items:center; gap:8px; padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--panel); font-size:13.5px; min-height:44px; }
  .swatch-btn .sw{ width:18px; height:18px; border-radius:50%; flex:none; border:1px solid rgba(255,255,255,0.25); }
  .swatch-btn[aria-pressed="true"]{ border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold); }
  .spots{ display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
  .spot-btn{ min-height:60px; border-radius:14px; border:1px solid var(--line); background:var(--panel); font-family:var(--display); font-weight:800; font-size:30px; color:var(--white); }
  .spot-btn[aria-pressed="true"]{ background:var(--gold); border-color:var(--gold); color:var(--gold-ink); }
  .field.invalid .spots .spot-btn{ border-color:var(--red); }
  .co-subhead{ font-weight:700; color:var(--white); margin:18px 0 10px; }
  .co-subhead small{ color:var(--muted); font-weight:500; }
  .apply-row{ display:flex; gap:8px; }
  .apply-row input{ flex:1; min-width:0; text-transform:uppercase; }
  .apply-btn{ flex:none; padding:0 18px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line); color:var(--white); font-weight:700; min-height:48px; }
  .apply-msg{ font-size:13.5px; margin-top:6px; min-height:1em; }
  .apply-msg.ok{ color:var(--green); font-weight:600; }
  .apply-msg.bad{ color:#FF7A74; font-weight:600; }
  .totals .disc span:last-child{ color:var(--green); }
  .tips{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .tip-btn{ padding:10px 6px; border:1px solid var(--line); border-radius:12px; background:var(--panel); min-height:58px; }
  .tip-btn strong{ display:block; color:var(--white); font-size:14.5px; }
  .tip-btn span{ display:block; color:var(--muted); font-size:12.5px; }
  .tip-btn[aria-pressed="true"]{ border-color:var(--gold); background:rgba(247,173,40,0.09); box-shadow:inset 0 0 0 1px var(--gold); }
  .co-summary .sum-line{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; color:var(--cream); font-size:14.5px; }
  .co-summary .sum-line span:last-child{ white-space:nowrap; }
  .co-foot{ position:fixed; left:0; right:0; bottom:0; z-index:3; padding:12px 16px calc(12px + var(--safe-b)); background:linear-gradient(to top, rgba(0,0,0,0.98) 75%, rgba(0,0,0,0)); }
  .co-foot-inner{ max-width:620px; margin:0 auto; }
  .co-msg{ color:var(--red); font-weight:600; font-size:14px; margin-bottom:8px; min-height:1em; }
  .co-secure{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:8px; }

  /* ---------- Toast ---------- */
  .toast{ position:fixed; left:50%; bottom:calc(92px + var(--safe-b)); transform:translate(-50%, 20px); z-index:90; background:var(--white); color:var(--gold-ink); font-weight:700; padding:11px 18px; border-radius:100px; box-shadow:0 10px 30px rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; display:flex; align-items:center; gap:8px; max-width:calc(100% - 32px); white-space:nowrap; }
  .toast span{ overflow:hidden; text-overflow:ellipsis; }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .toast svg{ width:18px; height:18px; color:var(--green); flex:none; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>

<header class="top">
  <img class="top-logo" src="logo.jpg" alt="" onerror="this.remove()">
  <div>
    <h1><span class="w1">Roll-In</span> <span class="w2">Shawarma</span></h1>
    <div class="top-meta">

<div class="toast" id="toast" role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span id="toastText"></span></div>

<script>
  var sbShared = supabase.createClient(
    'https://njcmcaoyzujijiyfardx.supabase.co',
    'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_'
  );

  // Photo fallback: dish photo first (item-<name>.jpg, same as the
  // kiosk); if a dish has no photo yet, show its category photo
  // instead of an empty square; if that's missing too, remove it.
  window.rsImgFallback = function(img){
    var fb = img.getAttribute('data-fallback');
    if (fb && img.getAttribute('src') !== fb) {
      img.removeAttribute('data-fallback');
      img.classList.add('is-fallback');
      img.src = fb;
    } else {
      img.onerror = null;
      img.remove();
    }
  };

  (function(){
    var CARD_CHECKOUT_URL = 'https://njcmcaoyzujijiyfardx.supabase.co/functions/v1/create-order-checkout';
    var PROMO_URL = 'https://njcmcaoyzujijiyfardx.supabase.co/functions/v1/validate-promo-code';
    var ANON_KEY = 'sb_publishable_KKGHpbDgmjrw0jdpxTlWKg_JzMgmCO_';
    var TAX_RATE = 0.0675;
    var HIDDEN_CATEGORIES = { 'Catering': 1, 'Combo Add-ons': 1, 'Deals': 1, 'Deal Selections': 1 };
    var CATEGORY_IMAGES = {
      'Shawarma': 'menu-shawarma.jpg', 'Frankie Rolls': 'menu-frankie.jpg',
      'Bowls': 'menu-bowl.jpg', 'Tacos': 'menu-tacos.jpg',
      'Loaded Fries': 'menu-fries.jpg', 'Sides': 'menu-samosas.jpg',
      'Kulfi Ice Cream': 'menu-kulfi.jpg', 'Drinks': 'menu-falooda.jpg'
    };
    // Same wording as the main website's menu.
    var CATEGORY_DESCRIPTIONS = {
      'Shawarma': 'Marinated chicken or falafel, white sauce, fries & pickled cucumber',
      'Frankie Rolls': 'Marinated chicken or paneer, fresh veggies, cilantro & lime',
      'Bowls': 'Flavored rice, cucumber, peppers, lettuce, tomato & sauce',
      'Sides': 'Regular / Large where noted'
    };
    var UPSELL_CATEGORIES = ['Sides', 'Kulfi Ice Cream', 'Drinks'];
    var COMBO_DRINK_NAMES = ['Coke', 'Diet Coke', 'Coke Zero', 'Sprite', 'Root Beer', 'Water'];
    var STORE_KEY = 'rollin_qr_cart_v1';
    var STORE_TTL_MS = 3 * 60 * 60 * 1000;
    var MAX_QTY = 20;

    var itemsById = {};
    var comboAddonsByName = {};
    var sections = [];          // [{ cat, groups: [group] }]
    var groupsByKey = {};       // key -> { key, cat, name, items }
    var cart = [];              // [{ menu_item_id, name, unitPrice, quantity }]

    // ---------- helpers ----------
    function $(id){ return document.getElementById(id); }
    function escHtml(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }
    function money(n){ return '$' + Number(n).toFixed(2); }
    function slugify(name){
      return String(name).toLowerCase().replace(/[()]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }
    function isAvailable(item){ return item && item.is_available !== false; }
    function itemLabel(item){ return item.name + (item.variant_name ? ' \u2013 ' + item.variant_name : ''); }
    function comboAddonPhoto(name){
      if (name === 'Combo Fries') return 'item-fries.jpg';
      if (name === 'Combo Water') return 'item-water.jpg';
      return 'item-soda.jpg';
    }
    function photoImg(item, cat, groupName){
      var src = item.image_url || (cat === 'Combo Add-ons' ? comboAddonPhoto(item.name) : ('item-' + slugify(groupName || item.name) + '.jpg'));
      var fb = CATEGORY_IMAGES[cat] || '';
      return '<img src="' + escHtml(src) + '" alt="" loading="lazy" decoding="async" data-fallback="' + escHtml(fb) + '" onerror="rsImgFallback(this)">';
    }
    function formatErrorMessage(err){
      if (!err) return null;
      if (typeof err === 'string') return err;
      if (Array.isArray(err) && err.length) {
        var first = err[0];
        if (first && typeof first === 'object') return first.detail || first.code || JSON.stringify(first);
        return String(first);
      }
      if (typeof err === 'object') return err.detail || err.message || JSON.stringify(err);
      return String(err);
    }
    var toastTimer = null;
    function hideToast(){ if (toastTimer) clearTimeout(toastTimer); $('toast').classList.remove('show'); }
    function toast(msg, ms){
      $('toastText').textContent = msg;
      $('toast').classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ $('toast').classList.remove('show'); }, ms || 1800);
    }

    // ---------- menu ----------
    function loadMenu(){
      $('menuState').classList.remove('hidden');
      $('menuState').innerHTML = 'Loading the menu&hellip;';
      // get_public_menu includes sold-out items so they can be shown
      // greyed out; if it isn't deployed yet, fall back to the table
      // (which only returns available items).
      sbShared.rpc('get_public_menu').then(function(res){
        if (res.error || !Array.isArray(res.data)) return sbShared.from('menu_items').select('*').order('display_order');
        return res;
      }).then(function(res){
        if (res.error || !res.data) {
          $('menuState').innerHTML = 'We couldn&rsquo;t load the menu. Check your connection and try again.<br><button type="button" id="menuRetryBtn">Try again</button>';
          $('menuRetryBtn').addEventListener('click', loadMenu);
          return;
        }
        buildMenu(res.data);
        restoreCart();
        renderMenu();
        afterCartChange(false);
        startAvailabilitySync();
      }).catch(function(){
        $('menuState').innerHTML = 'We couldn&rsquo;t load the menu. Check your connection and try again.<br><button type="button" id="menuRetryBtn">Try again</button>';
        $('menuRetryBtn').addEventListener('click', loadMenu);
      });
    }

    function buildMenu(rows){
      itemsById = {}; comboAddonsByName = {}; sections = []; groupsByKey = {};
      var byCat = {};
      rows.forEach(function(item){
        itemsById[item.id] = item;
        if (item.category === 'Combo Add-ons') comboAddonsByName[item.name] = item;
        if (HIDDEN_CATEGORIES[item.category]) return;
        if (!byCat[item.category]) { byCat[item.category] = { cat: item.category, groups: [] }; sections.push(byCat[item.category]); }
        // Items sharing a name are one dish with options (e.g. bowl proteins).
        var key = item.category + '::' + item.name;
        if (!groupsByKey[key]) {
          groupsByKey[key] = { key: key, cat: item.category, name: item.name, items: [] };
          byCat[item.category].groups.push(groupsByKey[key]);
        }
        groupsByKey[key].items.push(item);
      });
    }

    function groupPriceText(g){
      var pool = g.items.filter(isAvailable);
      if (!pool.length) pool = g.items;
      var prices = pool.map(function(i){ return Number(i.price); });
      var min = Math.min.apply(null, prices), max = Math.max.apply(null, prices);
      return (g.items.length > 1 && min !== max ? 'From ' : '') + money(min);
    }

    function renderMenu(){
      $('menuState').classList.add('hidden');
      var menu = $('menu');
      menu.querySelectorAll('.section, .menu-foot').forEach(function(n){ n.remove(); });

      $('catRail').innerHTML = sections.map(function(s, i){
        return '<button type="button" class="chip" data-jump="sec-' + i + '"' + (i === 0 ? ' aria-current="true"' : '') + '>' +
          '<img src="' + escHtml(CATEGORY_IMAGES[s.cat] || '') + '" alt="" onerror="this.remove()">' + escHtml(s.cat) + '</button>';
      }).join('');

      var html = sections.map(function(s, i){
        return '<section class="section" id="sec-' + i + '" aria-labelledby="sec-' + i + '-t">' +
          '<h2 class="section-title" id="sec-' + i + '-t">' + escHtml(s.cat) + '</h2>' +
          (CATEGORY_DESCRIPTIONS[s.cat] ? '<p class="section-desc">' + escHtml(CATEGORY_DESCRIPTIONS[s.cat]) + '</p>' : '') +
          '<div class="grid">' + s.groups.map(tileHtml).join('') + '</div>' +
        '</section>';
      }).join('');
      menu.insertAdjacentHTML('beforeend', html +
        '<p class="menu-foot">Prices are before 6.75% sales tax. Pay by card at checkout.</p>');
      setupScrollSpy();
    }

    function tileHtml(g){
      var soldOut = !g.items.some(isAvailable);
      var priceText = groupPriceText(g);
      var sub = g.items.length > 1 ? g.items.length + ' options' : '';
      return '<article class="tile' + (soldOut ? ' is-soldout' : '') + '" data-group="' + escHtml(g.key) + '">' +
        '<button type="button" class="tile-open" data-open="' + escHtml(g.key) + '"' + (soldOut ? ' disabled' : '') +
          ' aria-label="' + escHtml(g.name + ', ' + priceText + (soldOut ? ', sold out' : ', see details')) + '">' +
          '<span class="tile-photo">' + photoImg(g.items[0], g.cat, g.name) + '</span>' +
          '<span class="tile-body">' +
            '<span class="tile-name">' + escHtml(g.name) + '</span>' +
            (sub ? '<span class="tile-sub">' + sub + '</span>' : '') +
            '<span class="tile-price">' + priceText + '</span>' +
          '</span>' +
        '</button>' +
        '<div class="tile-actions-anchor" data-action="' + escHtml(g.key) + '">' + actionHtml(g) + '</div>' +
      '</article>';
    }

    function actionHtml(g){
      if (!g.items.some(isAvailable)) return '<span class="soldout-tag">Sold out</span>';
      if (g.items.length > 1) {
        var qty = g.items.reduce(function(s, i){ var l = findLine(i.id); return s + (l ? l.quantity : 0); }, 0);
        return '<button type="button" class="add-btn" data-open="' + escHtml(g.key) + '" aria-label="Choose options for ' + escHtml(g.name) + (qty ? ', ' + qty + ' in your order' : '') + '">' +
          (qty ? '<span class="add-count">' + qty + '</span>' : '+') + '</button>';
      }
      var item = g.items[0];
      var line = findLine(item.id);
      if (!line) return '<button type="button" class="add-btn" data-add="' + item.id + '" aria-label="Add ' + escHtml(g.name) + '">+</button>';
      return '<div class="stepper" role="group" aria-label="' + escHtml(g.name) + ' quantity">' +
        '<button type="button" data-dec="' + item.id + '" aria-label="Remove one ' + escHtml(g.name) + '">&minus;</button>' +
        '<span>' + line.quantity + '</span>' +
        '<button type="button" data-inc="' + item.id + '" aria-label="Add one more ' + escHtml(g.name) + '">+</button>' +
      '</div>';
    }

    function refreshTileActions(){
      Object.keys(groupsByKey).forEach(function(key){
        var el = document.querySelector('.tile-actions-anchor[data-action="' + cssAttr(key) + '"]');
        if (el) el.innerHTML = actionHtml(groupsByKey[key]);
      });
    }
    function cssAttr(s){ return String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"'); }

    // Menu clicks (delegated)
    $('menu').addEventListener('click', function(e){
      var t = e.target.closest('[data-add],[data-inc],[data-dec],[data-open]');
      if (!t || t.disabled) return;
      if (t.hasAttribute('data-add')) { addOne(t.getAttribute('data-add')); toast('Added ' + itemsById[t.getAttribute('data-add')].name); }
      else if (t.hasAttribute('data-inc')) addOne(t.getAttribute('data-inc'));
      else if (t.hasAttribute('data-dec')) removeOne(t.getAttribute('data-dec'));
      else if (t.hasAttribute('data-open')) openItemSheet(t.getAttribute('data-open'));
    });

    // Category chips: jump + follow the scroll
    $('catRail').addEventListener('click', function(e){
      var chip = e.target.closest('[data-jump]');
      if (!chip) return;
      var sec = $(chip.getAttribute('data-jump'));
      if (sec && typeof sec.scrollIntoView === 'function') sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setActiveChip(chip.getAttribute('data-jump'));
    });
    var activeChipId = null;
    function setActiveChip(id){
      if (id === activeChipId) return;
      activeChipId = id;
      var rail = $('catRail');
      rail.querySelectorAll('.chip').forEach(function(c){
        var on = c.getAttribute('data-jump') === id;
        if (on) c.setAttribute('aria-current', 'true'); else c.removeAttribute('aria-current');
        if (on) {
          var left = c.offsetLeft - (rail.clientWidth - c.offsetWidth) / 2;
          if (typeof rail.scrollTo === 'function') rail.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
        }
      });
    }
    function setupScrollSpy(){
      if (!('IntersectionObserver' in window)) return;
      var visible = {};
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){ visible[en.target.id] = en.isIntersecting ? en.boundingClientRect.top : null; });
        var best = null, bestTop = Infinity;
        Object.keys(visible).forEach(function(id){
          var top = visible[id];
          if (top !== null && top < bestTop) { best = id; bestTop = top; }
        });
        if (best) setActiveChip(best);
      }, { rootMargin: '-70px 0px -55% 0px' });
      document.querySelectorAll('.section').forEach(function(s){ io.observe(s); });
    }

    // ---------- cart (same line + combo model the backend expects) ----------
    function findLine(itemId){ return cart.find(function(c){ return c.menu_item_id === itemId; }); }
    function addOneRaw(itemId){
      var item = itemsById[itemId];
      if (!item) return;
      var line = findLine(itemId);
      if (line) { if (line.quantity < MAX_QTY) line.quantity += 1; }
      else cart.push({ menu_item_id: itemId, name: itemLabel(item), unitPrice: Number(item.price), quantity: 1 });
    }
    // Combos are fries + a drink added as their own lines. There can't be
    // more combos than combo-eligible items; extras are trimmed.
    function syncCombos(){
      var qualifying = cart.reduce(function(sum, line){
        var item = itemsById[line.menu_item_id];
        return sum + (item && item.combo_upcharge ? line.quantity : 0);
      }, 0);
      var friesItem = comboAddonsByName['Combo Fries'];
      if (!friesItem) return;
      var friesLine = findLine(friesItem.id);
      var friesQty = friesLine ? friesLine.quantity : 0;
      var drinkLines = COMBO_DRINK_NAMES.map(function(n){
        var di = comboAddonsByName['Combo ' + n];
        return di ? findLine(di.id) : null;
      }).filter(Boolean);
      var drinkQty = drinkLines.reduce(function(s, l){ return s + l.quantity; }, 0);
      var valid = Math.min(qualifying, friesQty, drinkQty);
      if (friesLine && friesLine.quantity > valid) {
        friesLine.quantity = valid;
        if (friesLine.quantity <= 0) cart = cart.filter(function(c){ return c.menu_item_id !== friesItem.id; });
      }
      var excess = drinkQty - valid;
      for (var i = drinkLines.length - 1; i >= 0 && excess > 0; i--) {
        var dl = drinkLines[i];
        var by = Math.min(excess, dl.quantity);
        dl.quantity -= by; excess -= by;
        if (dl.quantity <= 0) { var rid = dl.menu_item_id; cart = cart.filter(function(c){ return c.menu_item_id !== rid; }); }
      }
    }
    function addOne(itemId){ addOneRaw(itemId); syncCombos(); afterCartChange(true); }
    function removeOne(itemId){
      var item = itemsById[itemId];
      var line = findLine(itemId);
      if (!line) return;
      var minQty = item && item.min_quantity;
      if (minQty && line.quantity <= minQty) cart = cart.filter(function(c){ return c.menu_item_id !== itemId; });
      else {
        line.quantity -= 1;
        if (line.quantity <= 0) cart = cart.filter(function(c){ return c.menu_item_id !== itemId; });
      }
      syncCombos();
      afterCartChange(false);
    }
    function cartSubtotal(){ return cart.reduce(function(s, c){ return s + c.unitPrice * c.quantity; }, 0); }
    function cartCount(){ return cart.reduce(function(s, c){ return s + c.quantity; }, 0); }
    var appliedPromo = null;   // { code, discountAmount } once validated
    var appliedMember = null;  // 'MEMBER-1234' once verified
    // Same math as the server: tax on the discounted subtotal.
    function computeTotals(tip){
      var subtotalCents = Math.round(cartSubtotal() * 100);
      var discountCents = appliedPromo ? Math.min(subtotalCents, Math.round(appliedPromo.discountAmount * 100)) : 0;
      var taxedCents = subtotalCents - discountCents;
      var taxCents = Math.round(taxedCents * TAX_RATE);
      var tipCents = Math.round((tip || 0) * 100);
      return { subtotal: subtotalCents / 100, discount: discountCents / 100, tax: taxCents / 100, tip: tipCents / 100,
               total: (taxedCents + taxCents + tipCents) / 100, base: (taxedCents + taxCents) / 100 };
    }

    // ---- Member ID (optional): checked, then linked to the order ----
    function normalizeMember(v){
      v = String(v || '').trim().toUpperCase();

    function applyMember(){

        var row = res && Array.isArray(res.data) ? res.data[0] : (res && res.data);

    function renderCheckout(){

        var item = itemsById[c.menu_item_id] || {};
        return '<div class="sum-line"><span>' + c.quantity + ' \u00d7 ' + escHtml(item.name || c.name) +
          (item.variant_name ? '<br><span class="line-var">' + escHtml(item.variant_name) + '</span>' : '') +
          '</span><span>' + money(c.unitPrice * c.quantity) + '</span></div>';
      }).join('');
      $('coTotals').innerHTML =
        '<div><span>Subtotal</span><span>' + money(t.subtotal) + '</span></div>' +
        (t.discount > 0 ? '<div class="disc"><span>Promo (' + escHtml(appliedPromo.code) + ')</span><span>\u2212' + money(t.discount) + '</span></div>' : '') +
        '<div><span>Tax (6.75%)</span><span>' + money(t.tax) + '</span></div>' +
        '<div><span>Tip</span><span>' + (selectedTip === null ? '&mdash;' : money(t.tip)) + '</span></div>' +
        '<div class="grand"><span>Total</span><span>' + money(t.total) + '</span></div>';

      $('placeOrderBtn').innerHTML = 'Continue to payment <span class="cta-amt">' + money(t.total) + '</span>';
      $('coSecure').textContent = 'You\u2019ll pay by card on Square\u2019s secure checkout page next.';
    }

    function validateCheckout(){
      var problems = [];
      if (!$('custName').value.trim()) { problems.push('your first name'); $('nameField').classList.add('invalid'); }
      if (pickupMethod === 'curbside' && !parkingSpot) { problems.push('your parking spot'); $('spotField').classList.add('invalid'); }
      if (tipChoiceIndex === null) problems.push('a tip option (No tip is fine)');
      else if (selectedTip === null) problems.push('a tip amount');
      return problems;
    }

    $('placeOrderBtn').addEventListener('click', function(){
      var btn = this;
      var msg = $('coMsg');
      msg.textContent = '';
      if (!cart.length) { msg.textContent = 'Your order is empty.'; return; }
      var problems = validateCheckout();
      if (problems.length) {
        msg.textContent = 'Please add ' + problems.join(', ') + '.';
        var firstBad = document.querySelector('#checkoutScreen .invalid input, #checkoutScreen .invalid select, #checkoutScreen .invalid button');
        if (firstBad) firstBad.focus();
        return;
      }
      // A member ID or promo code typed but not applied: check it now,
      // so the total shown is the total charged.
      var needMember = $('memberId').value.trim() && !appliedMember;
      var needPromo = $('promoCode').value.trim() && !appliedPromo;
      if (needMember || needPromo) {
        btn.disabled = true;
        Promise.all([needMember ? applyMember() : true, needPromo ? applyPromo() : true]).then(function(ok){
          btn.disabled = false;
          if (ok[0] && ok[1]) btn.click();
          else msg.textContent = 'Fix or clear the member ID / promo code above, then try again.';
        });
        return;
      }

      var carMakeValue = null, carModelValue = null;
      if (pickupMethod === 'curbside') {
        carMakeValue = ($('carMakeSelect').value === 'Other' ? $('carMakeOther').value.trim() : $('carMakeSelect').value) || null;
        carModelValue = $('carModel').value.trim() || null;
      }
      var name = $('custName').value.trim();
      var email = $('custEmail').value.trim();
      var phone = $('custPhone').value.trim();
      var notes = $('custNotes').value.trim();
      var body = {
        items: cart.map(function(c){ return { menu_item_id: c.menu_item_id, quantity: c.quantity, name: c.name }; }),
        customerName: name,
        customerEmail: email || undefined,
        customerPhone: phone || undefined,
        notes: notes || undefined,
        orderSource: 'qr',
        pickupMethod: pickupMethod,
        parkingSpot: pickupMethod === 'curbside' ? parkingSpot : null,
        carMake: carMakeValue,
        carModel: carModelValue,
        carColor: pickupMethod === 'curbside' ? selectedCarColor : null,
        memberCode: appliedMember || undefined,
        promoCode: appliedPromo ? appliedPromo.code : undefined,
        tipAmount: selectedTip || 0
      };
      var url = CARD_CHECKOUT_URL;
      var prevHtml = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = 'Opening secure checkout\u2026';

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ANON_KEY },
        body: JSON.stringify(body)
      }).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
        .then(function(result){
          if (!result.ok) {
            btn.disabled = false; btn.innerHTML = prevHtml;
            msg.textContent = formatErrorMessage(result.data && result.data.error) || 'We couldn\u2019t start checkout. Please try again.';
            return;
          }
          rememberOrder(result.data);
          // Card: the cart is kept until payment is confirmed on
          // thank-you.html, so backing out of Square's page keeps it.
          window.location.href = result.data.url;
        })
        .catch(function(){
          btn.disabled = false; btn.innerHTML = prevHtml;
          msg.textContent = 'We couldn\u2019t reach checkout. Check your connection and try again.';
        });
    });

    // Remember the last order so a returning customer can jump to tracking.
    var LAST_ORDER_KEY = 'rollin_last_order';
    function rememberOrder(data){
      if (!data || !data.orderId) return;
      try { localStorage.setItem(LAST_ORDER_KEY, JSON.stringify({ id: data.orderId, ref: data.referenceCode, savedAt: Date.now() })); } catch(e){}
    }
    function showTrackBanner(){
      try {
        var last = JSON.parse(localStorage.getItem(LAST_ORDER_KEY) || 'null');
        if (!last || !last.id || Date.now() - last.savedAt > 3 * 60 * 60 * 1000) return;
        var b = $('trackBanner');
        b.querySelector('a').href = 'track.html?order=' + encodeURIComponent(last.id);
        var m = /^[A-Za-z]+-?(\d+)$/.exec(last.ref || '');
        $('trackBannerRef').textContent = m ? '#' + m[1] : (last.ref || 'your order');
        b.classList.remove('hidden');
      } catch(e){}
    }
    showTrackBanner();

    window.addEventListener('pageshow', function(e){
      if (e.persisted) { $('placeOrderBtn').disabled = false; renderCheckout(); }
    });

    // ---------- live sold-out sync ----------
    // When an item is marked sold out in Square POS, sync-sold-out flips
    // it in the menu, and menu_item_availability streams that change
    // here in real time. A 30-second check (and a check whenever the
    // phone wakes) backs up the live connection, which phones drop
    // while asleep.
    function applyAvailability(id, available){
      var item = itemsById[id];
      if (!item) return;
      if ((item.is_available !== false) === available) return;
      item.is_available = available;

      var g = groupsByKey[item.category + '::' + item.name];
      if (g) {
        var tile = document.querySelector('.tile[data-group="' + cssAttr(g.key) + '"]');
        if (tile) tile.outerHTML = tileHtml(g);
      }

      if (!available) {
        if (findLine(id)) {
          cart = cart.filter(function(c){ return c.menu_item_id !== id; });
          syncCombos();
          afterCartChange(false);
          toast(item.name + ' just sold out and was removed', 4500);
        }
        // Item sheet open on this dish: switch to another option or close.
        if (openSheetEl === $('itemSheet') && sheet.group && sheet.group === g) {
          var next = g.items.filter(isAvailable)[0];
          if (!next) { closeSheet(); toast(g.name + ' just sold out', 4500); }
          else { if (sheet.itemId === id) { sheet.itemId = next.id; sheet.combo = false; sheet.drink = null; } renderItemSheet(); }
        }
      } else if (openSheetEl === $('itemSheet') && sheet.group && sheet.group === g) {
        renderItemSheet();
      }

      if (!$('checkoutScreen').classList.contains('hidden')) {
        if (!cart.length) {
          $('checkoutScreen').classList.add('hidden');
          document.body.classList.remove('locked');
          toast('Your order is empty now \u2014 that item just sold out', 4500);
        } else {
          renderCheckout();
        }
      }
      if (openSheetEl === $('cartSheet')) renderCart();
    }
    function refreshAvailability(){
      sbShared.from('menu_item_availability').select('menu_item_id,is_available').then(function(res){
        if (res.error || !Array.isArray(res.data)) return;
        res.data.forEach(function(r){ applyAvailability(r.menu_item_id, r.is_available !== false); });
      }).catch(function(){});
    }
    var availabilityStarted = false;
    function startAvailabilitySync(){
      if (availabilityStarted) return;
      availabilityStarted = true;
      try {
        sbShared.channel('menu-availability')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'menu_item_availability' }, function(payload){
            var r = payload && payload.new;
            if (r && r.menu_item_id) applyAvailability(r.menu_item_id, r.is_available !== false);
          })
          .subscribe();
      } catch(e){}
      setInterval(refreshAvailability, 30000);
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'visible') refreshAvailability();
      });
    }

    // ---------- live kitchen line (real orders in progress) ----------
    function loadKitchenPulse(){
      sbShared.rpc('get_public_order_status_board').then(function(res){
        if (res.error || !Array.isArray(res.data)) { $('kitchenPulse').classList.add('hidden'); return; }
        var cooking = res.data.filter(function(o){ return o.display_stage !== 'ready' && o.display_stage !== 'picked_up'; }).length;
        $('kitchenPulseText').textContent = cooking === 0 ? 'No orders ahead of you'
          : cooking + (cooking === 1 ? ' order' : ' orders') + ' cooking right now';
        $('kitchenPulse').classList.toggle('busy', cooking >= 5);
        $('kitchenPulse').classList.remove('hidden');
      }).catch(function(){ $('kitchenPulse').classList.add('hidden'); });
    }

    loadMenu();
    loadKitchenPulse();
    setInterval(loadKitchenPulse, 60000);
  })();
</script>
</body>
